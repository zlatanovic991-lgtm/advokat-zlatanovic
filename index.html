<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#F7F5F0;--surface:#FFFFFF;--surface2:#F2EFE9;--surface3:#E8E4DC;
--text:#1A1916;--text2:#5C5950;--text3:#9B978E;
--border:#D8D4CC;--border2:#C4C0B8;
--accent:#1E3A5F;--accent2:#2C5282;--accent-light:#EBF0F7;
--success:#2D6A4F;--success-bg:#E8F5EE;
--warn:#92400E;--warn-bg:#FEF3C7;
--danger:#991B1B;--danger-bg:#FEE2E2;
--info:#1E3A5F;--info-bg:#EBF0F7;
--radius:8px;--radius-lg:12px;--radius-xl:16px;
--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
--shadow-lg:0 4px 16px rgba(0,0,0,.10);
--font:'DM Sans',sans-serif;--font-serif:'DM Serif Display',serif;
--sidebar:240px;--transition:0.18s ease;
}
[data-theme="dark"]{
--bg:#0F1117;--surface:#1A1D27;--surface2:#22263A;--surface3:#2A2E42;
--text:#F0EDE8;--text2:#A8A4A0;--text3:#6B6860;
--border:#2E3348;--border2:#3A3F58;
--accent:#4A7EC7;--accent2:#5B9AE0;--accent-light:#1A2540;
--success:#4ADE80;--success-bg:#052E16;
--warn:#FCD34D;--warn-bg:#451A03;
--danger:#F87171;--danger-bg:#450A0A;
--info:#93C5FD;--info-bg:#1E3A5F22;
--shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
--shadow-lg:0 4px 16px rgba(0,0,0,.4);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;display:flex;transition:background var(--transition),color var(--transition)}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;width:100%;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
select option{background:var(--surface);color:var(--text)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* SIDEBAR */
#sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;transition:transform var(--transition),background var(--transition)}
.sidebar-logo{padding:16px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo img{border-radius:10px;background:#fff}
.logo-title{font-family:var(--font-serif);font-size:22px;color:var(--accent);letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.sidebar-nav{padding:12px 0;flex:1;overflow-y:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text2);font-weight:500;font-size:13.5px;cursor:pointer;border-radius:0;transition:background var(--transition),color var(--transition);border-left:3px solid transparent;margin:1px 0}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2);font-weight:500}
.toggle-btn{width:36px;height:20px;background:var(--surface3);border-radius:10px;position:relative;cursor:pointer;border:none;transition:background var(--transition)}
.toggle-btn.on{background:var(--accent)}
.toggle-knob{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform var(--transition)}
.toggle-btn.on .toggle-knob{transform:translateX(16px)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto;height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10;flex-shrink:0}
.topbar-title{font-family:var(--font-serif);font-size:20px;color:var(--text)}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;min-width:220px}
.search-box svg{width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.search-box input{background:none;border:none;padding:0;font-size:13px;color:var(--text);outline:none;width:100%}
.search-box input::placeholder{color:var(--text3)}
.page-content{padding:24px;flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;cursor:pointer;transition:all var(--transition);border:1px solid transparent;white-space:nowrap}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-secondary{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface3);border-color:var(--border2)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:var(--radius)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.card-sm{padding:14px 16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.stat-value{font-family:var(--font-serif);font-size:28px;color:var(--text);line-height:1}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* GRID */
.gcal-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead{background:var(--surface2)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--transition);cursor:pointer}
tbody tr:hover{background:var(--surface2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--success-bg);color:var(--success)}
.badge-red{background:var(--danger-bg);color:var(--danger)}
.badge-yellow{background:var(--warn-bg);color:var(--warn)}
.badge-blue{background:var(--info-bg);color:var(--info)}
.badge-gray{background:var(--surface3);color:var(--text2)}
.badge-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--radius-xl);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-family:var(--font-serif);font-size:18px}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--text2);font-size:16px;transition:background var(--transition)}
.close-btn:hover{background:var(--surface3)}

/* FORM */
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-section{margin-bottom:24px}
.form-section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* FILTERS */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filter-chip{padding:5px 14px;border-radius:20px;font-size:12.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all var(--transition)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip:hover:not(.active){background:var(--surface2)}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0}
.timeline-item{display:flex;gap:16px;padding-bottom:20px;position:relative}
.timeline-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--border)}
.timeline-dot{width:32px;height:32px;border-radius:50%;background:var(--accent-light);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.timeline-dot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.timeline-content{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.timeline-meta{font-size:11px;color:var(--text3);margin-top:4px}

/* DASHBOARD QUICK */
.quick-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.quick-item:last-child{border-bottom:none}
.quick-avatar{width:36px;height:36px;border-radius:var(--radius);background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--accent);flex-shrink:0}
.quick-name{font-weight:500;font-size:13.5px}
.quick-sub{font-size:12px;color:var(--text2)}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all var(--transition)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}

/* MOBILE TOGGLE */
#mob-toggle{display:none;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border)}
#mob-toggle svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty svg{width:48px;height:48px;stroke:var(--border2);fill:none;stroke-width:1.5;margin:0 auto 12px;display:block}
.empty h3{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty p{font-size:13px;color:var(--text3)}

/* ALERT */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-warn{background:var(--warn-bg);color:var(--warn)}
.alert-success{background:var(--success-bg);color:var(--success)}
.alert-danger{background:var(--danger-bg);color:var(--danger)}

/* PROGRESS */
.progress{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}

/* UPLOAD AREA */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:32px;text-align:center;cursor:pointer;transition:all var(--transition);color:var(--text2)}
.upload-area:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.upload-area svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.5;margin:0 auto 8px;display:block}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;height:100%;z-index:100;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #mob-toggle{display:flex}
  .mob-overlay.show{display:block}
  .page-content{padding:16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .grid-auto{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .topbar{padding:0 16px}
  .search-box{min-width:160px}
  .modal{max-width:100%;max-height:100vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;align-self:flex-end}
  .modal-overlay{align-items:flex-end;padding:0}
}
@media(max-width:480px){
  .search-box{min-width:120px}
  .topbar-title{font-size:17px}
  th,td{padding:8px 10px}
}

/* ===== MOBILE POPRAVKE ===== */

/* Sprecava SVAKI horizontalni scroll na cijeloj stranici */
html, body { max-width: 100%; overflow-x: hidden; }
#main { max-width: 100%; overflow-x: hidden; }

@media(max-width:600px){

  /* Sprecava overflow na svim elementima */
  * { max-width: 100%; }

  /* Topbar — kompaktan, bez preloma */
  .topbar{height:auto;min-height:52px;padding:6px 8px;gap:5px;flex-wrap:nowrap;overflow:hidden}
  .topbar-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;flex-shrink:1}
  .topbar-actions{gap:4px;flex-shrink:0;flex-wrap:nowrap}
  .topbar-actions .btn{font-size:11px!important;padding:5px 7px!important;white-space:nowrap}
  #addBtnLabel{display:none}
  .google-btn{font-size:11px!important;padding:5px 7px!important;gap:3px}
  .google-btn svg{width:14px;height:14px;flex-shrink:0}
  #topbarGoogleLabel{display:none}

  /* Page content */
  .page-content{padding:8px 6px!important;overflow-x:hidden}

  /* Tabele — card layout na mobilnom, BEZ horizontalnog scrolla */
  .table-wrap{overflow:hidden}
  .table-wrap table{width:100%!important;min-width:0!important;border-collapse:collapse}
  .table-wrap thead{display:none}
  .table-wrap tbody tr{display:block;border-bottom:1px solid var(--border);padding:10px 12px;cursor:pointer}
  .table-wrap tbody tr:last-child{border-bottom:none}
  .table-wrap td{display:flex;flex-direction:column;border:none!important;padding:1px 0!important;font-size:13px;white-space:normal!important;word-break:break-word;max-width:100%}
  .table-wrap td::before{content:attr(data-label);font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
  .table-wrap td[data-label=""]::before,.table-wrap td:not([data-label])::before{display:none}
  .table-wrap td:empty{display:none}
  /* Akcijska dugmad — horizontalno */
  .table-wrap td:last-child{flex-direction:row;flex-wrap:wrap;gap:4px;margin-top:6px;padding-top:4px!important;border-top:1px solid var(--border)!important}
  .table-wrap td:last-child::before{display:none}
  .table-wrap td:last-child .btn{font-size:11px!important;padding:4px 10px!important}
  /* Badge unutar td — inline */
  .table-wrap td .badge{display:inline-flex}
  .table-wrap td .id-badge{display:inline-block}

  /* Dashboard inline grid 4 kolone -> 2x2 */
  .dash-top-grid{grid-template-columns:1fr 1fr!important}
  [style*="grid-template-columns:2fr 1fr 1fr 1fr"]{grid-template-columns:1fr 1fr!important}
  [style*="grid-template-columns: 2fr 1fr 1fr 1fr"]{grid-template-columns:1fr 1fr!important}

  /* Svi gridovi -> 1 kolona */
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr!important}
  .gcal-grid{grid-template-columns:1fr!important}

  /* Forme */
  .form-row{grid-template-columns:1fr!important}
  input,select,textarea{font-size:16px!important;max-width:100%}

  /* Danas i sutra kartica — ne smije da izlazi */
  .card{overflow:hidden;min-width:0;box-sizing:border-box}

  /* renderAktItem redovi — prilagodi za mobilni */
  .stat-card [style*="display:flex;align-items:center;gap:10px;padding:7px 0"]{
    flex-wrap:wrap;gap:6px
  }
  .stat-card [style*="flex:1;min-width:0"]{
    min-width:0;flex-basis:60%;overflow:hidden
  }
  /* Header kartice sa dugmetom i badge-ovima */
  .stat-card [style*="display:flex;gap:8px;align-items:center"]{
    flex-wrap:wrap;gap:4px
  }

  /* Aktivnosti timeline */
  .timeline-content{padding:8px;overflow:hidden}
  .timeline-content > div:first-child{flex-wrap:wrap;gap:4px}
  .timeline-content .btn{font-size:11px!important;padding:4px 7px!important}
  .timeline-item{gap:6px;min-width:0}
  .timeline-item > *{min-width:0;overflow:hidden}

  /* Nazivi u timeline — ne izlaze */
  .timeline-content [style*="font-size:13.5px"]{white-space:normal!important;word-break:break-word}
  .timeline-content [style*="font-size:11px"]{white-space:normal!important;word-break:break-word}

  /* Stat kartice */
  .stat-card{padding:10px 8px}
  .stat-value{font-size:18px}

  /* Modal */
  .modal-body{padding:14px}
  .modal-header{padding:12px 14px}
  .modal{overflow-x:hidden}

  /* Detail header */
  .detail-header{padding:12px 10px;overflow:hidden}
  .detail-meta{gap:6px;flex-wrap:wrap}

  /* GCal event wrap */
  .gcal-event{flex-wrap:wrap;min-width:0}

  /* Tabs — scroll ali bez vidljivog overflow */
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:8px 10px;font-size:12px}

  /* Filter bar */
  .filter-bar{gap:4px;flex-wrap:wrap}
  .filter-chip{font-size:11px;padding:3px 8px}

  /* Section header */
  .section-header{flex-wrap:wrap;gap:6px}
  .section-header .btn{font-size:12px;padding:5px 8px}
  .section-title{font-size:18px}

  /* Detail tabs dugmad — wrap */
  .detail-tabs{flex-wrap:wrap;gap:4px}

  /* Buttons u sekciji — manji */
  .btn-sm{font-size:11px!important;padding:4px 8px!important}
}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.section-title{font-family:var(--font-serif);font-size:22px;color:var(--text)}
.section-sub{font-size:13px;color:var(--text2);margin-top:2px}

/* DETAIL VIEW */
.detail-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.detail-title{font-family:var(--font-serif);font-size:20px;margin-bottom:4px}
.detail-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.detail-meta-item{font-size:12.5px;color:var(--text2)}
.detail-meta-item strong{color:var(--text);font-weight:500}
.detail-tabs-content{display:none}
.detail-tabs-content.active{display:block}

/* FINANCE */
.finance-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.finance-row:last-child{border-bottom:none}
.amount-pos{color:var(--success);font-weight:600}
.amount-neg{color:var(--danger);font-weight:600}
.amount-neutral{font-weight:600}

/* NOTIFICATION DOT */
.notif-dot{width:8px;height:8px;border-radius:50%;background:#E53E3E;position:absolute;top:6px;right:6px}

/* BACK BUTTON */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:16px;padding:4px 0;transition:color var(--transition)}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ID BADGE */
.id-badge{font-family:monospace;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text2)}

/* ROČIŠTE URGENCY */
.rociste-urgent{background:var(--danger-bg);border-left:3px solid var(--danger);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.rociste-soon{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.rociste-ok{background:var(--success-bg);border-left:3px solid var(--success);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}

/* DATE INPUT */
.date-input-wrap{position:relative}
.date-input-wrap input{padding-right:36px;letter-spacing:.5px}
.date-cal-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:15px;cursor:pointer;background:none;border:none;padding:2px;line-height:1;opacity:.6;transition:opacity .15s}
.date-cal-btn:hover{opacity:1}
/* Calendar picker popup */
.cal-popup{position:absolute;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:12px;min-width:260px;user-select:none}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);padding:2px 8px;border-radius:var(--radius);transition:background .15s}
.cal-nav:hover{background:var(--surface2)}
.cal-month-label{font-weight:600;font-size:14px;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-name{text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0;text-transform:uppercase}
.cal-day{text-align:center;font-size:13px;padding:5px 2px;border-radius:6px;cursor:pointer;color:var(--text);transition:background .1s}
.cal-day:hover{background:var(--surface2)}
.cal-day.today{color:var(--accent);font-weight:700}
.cal-day.selected{background:var(--accent);color:#fff!important;font-weight:600}
.cal-day.other-month{color:var(--text3)}
.cal-day.empty{cursor:default}
input.date-invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px var(--danger-bg)!important}

/* GOOGLE INTEGRATION */
.google-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:6px;font-size:13.5px;font-weight:500;cursor:pointer;transition:box-shadow .2s;font-family:var(--font)}
.google-btn:hover{box-shadow:0 1px 6px rgba(0,0,0,.2)}
.google-btn svg{width:18px;height:18px;flex-shrink:0}
.gcal-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.gcal-event{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.gcal-event:last-child{border-bottom:none}
.gcal-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px}
.gcal-time{font-size:11px;color:var(--text3);white-space:nowrap}
.gtask-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.gtask-item:last-child{border-bottom:none}
.gtask-check{width:16px;height:16px;border:2px solid var(--border2);border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gtask-check.done{background:var(--success);border-color:var(--success);color:#fff}
.google-status{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.google-status.connected{color:var(--success)}

/* SHUTDOWN DIALOG */
.shutdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.shutdown-box{background:var(--surface);border-radius:var(--radius-xl);padding:24px;max-width:320px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
.shutdown-box p{font-size:14px;color:var(--text2);margin-bottom:18px;line-height:1.5}
.shutdown-box .btns{display:flex;gap:10px;justify-content:center}
.shutdown-box .btns .btn{flex:1;justify-content:center}

/* EVENT-PREDMET LINK */
.gcal-link-btn{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:var(--font)}
.gcal-link-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.gcal-link-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-top:6px}
.gcal-predmet-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--accent-light);color:var(--accent);border-radius:12px;padding:3px 8px;cursor:pointer;font-weight:500;border:1px solid var(--accent)}
.gcal-predmet-badge:hover{background:var(--accent);color:#fff}



/* PODSETNIK NOTIFIKACIJA */
.notif-banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:20px}
.notif-banner-title{font-weight:600;font-size:13.5px;color:var(--warn);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.notif-klijent-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;gap:8px}
.notif-klijent-row:last-child{border-bottom:none}
.notif-phone{font-weight:600;color:var(--text);font-size:13.5px}
.notif-days{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.notif-days.urgent{background:var(--danger-bg);color:var(--danger)}
.notif-days.soon{background:var(--warn-bg);color:var(--warn)}

/* NEW GCAL EVENT FORM */
.gcal-new-event-form{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.gcal-new-event-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>

<script>

// ========== DATE INPUT HELPERS ==========
// Internal storage format: YYYY-MM-DD
// Display/input format: DD/MM/YYYY
function isoToDisplay(iso){
  if(!iso)return'';
  const [y,m,d]=iso.split('-');
  if(!y||!m||!d)return iso;
  return d+'/'+m+'/'+y;
}
function displayToIso(disp){
  if(!disp)return'';
  const parts=disp.split('/');
  if(parts.length===3&&parts[2].length===4){
    return parts[2]+'-'+parts[1].padStart(2,'0')+'-'+parts[0].padStart(2,'0');
  }
  return disp; // fallback: return as-is if not parseable
}
function formatDateInput(input){
  // Auto-format as user types: insert slashes after dd and mm
  let v=input.value.replace(/\D/g,''); // digits only
  if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);
  if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5);
  v=v.slice(0,10);
  input.value=v;
  // Validate
  if(v.length===10){
    const iso=displayToIso(v);
    const dt=new Date(iso);
    input.classList.toggle('date-invalid',isNaN(dt.getTime()));
  } else {
    input.classList.remove('date-invalid');
  }
}
function makeDateInput(id, isoValue, noDefault){
  const iso=(!isoValue&&!noDefault)?new Date().toISOString().slice(0,10):(isoValue||'');
  const val=isoToDisplay(iso);
  return `<div class="date-input-wrap" style="position:relative">` +
    `<input type="text" id="${id}" value="${val}" placeholder="dd/mm/yyyy" maxlength="10" oninput="formatDateInput(this)" autocomplete="off" onkeydown="if(event.key==='Escape'){closeCal();event.stopPropagation()}">` +
    `<button type="button" class="date-cal-btn" onclick="toggleCal('${id}',this)" tabindex="-1">📅</button>` +
    `</div>`;
}
function getDateVal(id){
  // Read dd/mm/yyyy field and return ISO YYYY-MM-DD for storage
  const el=document.getElementById(id);

}

// ========== CALENDAR PICKER ==========
let _calActive = null; // {inputId, el (popup)}

const CAL_MONTHS = ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
const CAL_DAYS   = ['Po','Ut','Sr','Če','Pe','Su','Ne'];

function toggleCal(inputId, btnEl){
  if(_calActive && _calActive.inputId === inputId){ closeCal(); return; }
  closeCal();
  const input = document.getElementById(inputId);
  if(!input) return;
  // Parse current value
  let year, month, selDay=null;
  const iso = displayToIso(input.value);
  const parsed = iso ? new Date(iso) : null;
  if(parsed && !isNaN(parsed)){
    year = parsed.getFullYear(); month = parsed.getMonth(); selDay = parsed.getDate();
  } else {
    const n = new Date(); year = n.getFullYear(); month = n.getMonth();
  }
  const popup = document.createElement('div');
  popup.className = 'cal-popup';
  // Position below input
  const wrap = input.closest('.date-input-wrap');
  wrap.appendChild(popup);
  _calActive = { inputId, popup, year, month, selDay };
  renderCal();
  // Close on outside click
  setTimeout(()=>document.addEventListener('mousedown', calOutsideClick), 0);
}

function calOutsideClick(e){
  if(!_calActive) return;
  if(!_calActive.popup.contains(e.target)){
    const input = document.getElementById(_calActive.inputId);
    const btn = input?.closest('.date-input-wrap')?.querySelector('.date-cal-btn');
    if(btn && btn.contains(e.target)) return;
    closeCal();
  }
}

function closeCal(){
  if(_calActive){
    _calActive.popup.remove();
    document.removeEventListener('mousedown', calOutsideClick);
    _calActive = null;
  }
}

function calNav(dir){
  if(!_calActive) return;
  _calActive.month += dir;
  if(_calActive.month > 11){ _calActive.month = 0; _calActive.year++; }
  if(_calActive.month < 0) { _calActive.month = 11; _calActive.year--; }
  renderCal();
}

function calPick(day){
  if(!_calActive || !day) return;
  const {year, month, inputId} = _calActive;
  _calActive.selDay = day;
  const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  const input = document.getElementById(inputId);
  if(input){
    input.value = isoToDisplay(iso);
    input.classList.remove('date-invalid');
    input.dispatchEvent(new Event('input'));
  }
  renderCal();
  setTimeout(closeCal, 120);
}

function renderCal(){
  if(!_calActive) return;
  const {popup, year, month, selDay} = _calActive;
  const today = new Date();
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  // Convert to Mon-first: Sun=6, Mon=0...
  const startOffset = (firstDay === 0) ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();

  let cells = '';
  // Day name headers
  CAL_DAYS.forEach(d => { cells += `<div class="cal-day-name">${d}</div>`; });
  // Leading empty cells (prev month days)
  for(let i=0; i<startOffset; i++){
    const d = daysInPrev - startOffset + 1 + i;
    cells += `<div class="cal-day other-month" onclick="calNav(-1);setTimeout(()=>calPick(${d}),50)">${d}</div>`;
  }
  // Current month days
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===today.getDate() && month===today.getMonth() && year===today.getFullYear();
    const isSel = d===selDay;
    const cls = 'cal-day' + (isToday?' today':'') + (isSel?' selected':'');
    cells += `<div class="${cls}" onclick="calPick(${d})">${d}</div>`;
  }
  // Trailing cells
  const total = startOffset + daysInMonth;
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let d=1; d<=trailing; d++){
    cells += `<div class="cal-day other-month" onclick="calNav(1);setTimeout(()=>calPick(${d}),50)">${d}</div>`;
  }

  popup.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)" type="button">‹</button>
      <div class="cal-month-label">${CAL_MONTHS[month]} ${year}</div>
      <button class="cal-nav" onclick="calNav(1)" type="button">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div style="text-align:center;margin-top:8px">
      <button type="button" class="btn btn-secondary btn-sm" onclick="calPickToday()">Danas</button>
    </div>`;
}

function calPickToday(){
  if(!_calActive) return;
  const n = new Date();
  _calActive.year = n.getFullYear();
  _calActive.month = n.getMonth();
  calPick(n.getDate());
}

// ========== NORMALIZACIJA ZA MATCHING ==========
function normalizeStr(s){
  if(!s) return '';
  return s
    .toLowerCase()
    // dijakritici -> osnovno slovo
    .replace(/[čć]/g,'c')
    .replace(/[š]/g,'s')
    .replace(/[ž]/g,'z')
    .replace(/[đ]/g,'dj')
    .replace(/[á]/g,'a').replace(/[é]/g,'e').replace(/[í]/g,'i').replace(/[ó]/g,'o').replace(/[ú]/g,'u')
    // ukloni pravne sufikse i lokacije
    .replace(/\bd\.?\s*o\.?\s*o\.?\b/g,'')
    .replace(/\ba\.?\s*d\.?\b/g,'')
    .replace(/\bj\.?\s*p\.?\b/g,'')
    .replace(/\bd\.?\s*o\.?\s*o\.?\s*\./g,'')
    .replace(/\bpirot\b|\bnis\b|\bbeograd\b|\bkragujevac\b|\bnovisad\b|\bsubotica\b/g,'')
    // ukloni interpunkciju i višestruke razmake
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function tokenSet(s){
  // Vrati sortirani set tokena (reči) — "petrović predrag" == "predrag petrović"
  return normalizeStr(s).split(' ').filter(t=>t.length>1).sort();
}

function tokensMatch(a, b){
  // Svaki token iz kraćeg niza mora biti sadržan u dužem nizu
  const ta = tokenSet(a);
  const tb = tokenSet(b);
  if(!ta.length || !tb.length) return false;
  const shorter = ta.length <= tb.length ? ta : tb;
  const longer  = ta.length <= tb.length ? tb : ta;
  return shorter.every(tok => longer.some(t => t.includes(tok) || tok.includes(t)));
}

// ========== AUTO-PREPOZNAVANJE PREDMETA IZ GCAL ==========
function gAutoLinkEvents(){
  if(!gCalendarEvents.length || !db.predmeti.length) return;
  const links = gGetLinks();
  const autoLinked = gGetAutoLinked();
  let changed = false;

  gCalendarEvents.forEach(ev => {
    // Preskoči samo ručno povezane (nisu u autoLinked)
    if(links[ev.id] && !autoLinked[ev.id]) return;

    const title = ev.summary || '';
    const desc  = ev.description || '';
    const haystack = normalizeStr(title + ' ' + desc);

    let matchedPredmet = null;

    // 1. Po sudskom broju — mora biti zasebna celina
    for(const p of db.predmeti){
      if(p.status === 'arhiviran') continue;
      const sudski = normalizeStr(p.sudski || '').trim();
      if(!sudski) continue;
      const re = new RegExp('(^|[\\s])' + sudski.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '($|[\\s])');
      if(re.test(haystack)){
        matchedPredmet = p; break;
      }
    }

    // 2. Po internom broju — mora biti zasebna reč, ne deo dužeg broja/teksta
    if(!matchedPredmet){
      for(const p of db.predmeti){
        if(p.status === 'arhiviran') continue;
        const interni = normalizeStr(p.interni || '').trim();
        if(!interni) continue;
        // Traži interni broj kao zasebnu reč (okružen razmakom, početkom ili krajem)
        const re = new RegExp('(^|[\\s\\-—/\\(\\)])' + interni.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '($|[\\s\\-—/\\(\\)])');
        if(re.test(haystack)){
          matchedPredmet = p; break;
        }
      }
    }

    // 3. Po imenu klijenta — svi tokeni imena moraju biti u naslovu
    if(!matchedPredmet){
      for(const p of db.predmeti){
        if(p.status === 'arhiviran') continue;
        const k = getKlijent(p.klijentId);
        if(!k || !k.ime) continue;
        const imeTokeni = normalizeStr(k.ime).split(' ').filter(t=>t.length>1);
        if(imeTokeni.length === 0) continue;
        // Svi tokeni imena moraju biti prisutni u naslovu
        if(imeTokeni.every(tok => haystack.includes(tok))){
          matchedPredmet = p; break;
        }
      }
    }

    if(matchedPredmet){
      if(links[ev.id] !== matchedPredmet.id){
        links[ev.id] = matchedPredmet.id;
        autoLinked[ev.id] = true;
        changed = true;
        console.log(`[AutoLink] "${ev.summary}" → predmet ${matchedPredmet.interni}`);
      }
    }
  });

  if(changed){
    gSaveLinks(links);
    gSaveAutoLinked(autoLinked);
  }
}

function gLinkSearch(eventId, query){

  const matches = db.predmeti
    .filter(p => p.status !== 'arhiviran')
    .filter(p => {
      const k = getKlijent(p.klijentId);
      const ime = normalizeStr(k?k.ime:'');
      const interni = normalizeStr(p.interni||'');
      const sudski = normalizeStr(p.sudski||'');
      return ime.includes(q) || interni.includes(q) || sudski.includes(q);
    })
    .slice(0, 15);
  if(matches.length === 0){
    resultsEl.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--text3)">Nema rezultata</div>`;
  } else {

      const sudski = p.sudski ? '<span style="color:var(--text3);font-size:10px"> · '+esc(p.sudski)+'</span>' : '';
      return '<div onclick="gLinkPick(\''+eventId+'\',\''+p.id+'\')"'+
        ' style="padding:7px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);overflow:hidden"'+
        ' onmouseover="this.style.background=\'var(--surface2)\'"'+
        ' onmouseout="this.style.background=\'\'">'+
        '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="font-weight:600">'+esc(p.interni)+'</span> — '+esc(k?k.ime:'')+sudski+'</div>'+
        (p.protivna?'<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">'+protivna+'</div>':'')+
        '</div>';
    }).join('');
  }
  resultsEl.style.display = 'block';
}

async function gLoadTasks(){

      await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest');

    const listsResp = await gapi.client.tasks.tasklists.list({ maxResults: 10 });
    const lists = listsResp.result.items || [];
    if(lists.length === 0){ gTasks=[]; return; }
    gTaskListId = lists[0].id;
    const tasksResp = await gapi.client.tasks.tasks.list({
      tasklist: gTaskListId,
      showCompleted: true,
      maxResults: 50
    });
    gTasks = (tasksResp.result.items || []).sort((a,b)=>{
      if(a.status==='completed' && b.status!=='completed') return 1;
      if(a.status!=='completed' && b.status==='completed') return -1;
      return 0;
    });
  } catch(e){
    console.warn('Tasks API error:', e);
    // Tasks scope missing - need re-auth
    if(e.status===403||e.status===401){
      gTasksNeedReauth = true;
    }
    gTasks = [];
  }
}

// Kreiranje novog događaja u Google Calendar
async function gCreateCustomEvent(){
  if(!gIsSignedIn){ alert('Povežite Google nalog prvo.'); return; }
  const tip = document.getElementById('m_ev_tip')?.value || 'Ročište';
  const naziv = document.getElementById('new_ev_naziv')?.value?.trim();
  const datum = document.getElementById('new_ev_datum')?.value;
  const vreme = document.getElementById('new_ev_vreme')?.value?.trim();
  const predmetId = document.getElementById('new_ev_predmet')?.value;
  if(!naziv){ alert('Unesite naziv događaja.'); return; }
  if(!datum){ alert('Unesite datum.'); return; }
  // Konvertuj datum iz DD/MM/YYYY u YYYY-MM-DD
  const parts = datum.split('/');
  if(parts.length !== 3){ alert('Format datuma: DD/MM/YYYY'); return; }
  const iso = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
  const p = predmetId ? getPredmet(predmetId) : null;
  const k = p ? getKlijent(p.klijentId) : null;
  const fullNaziv = p ? `${tip}: ${p.interni} — ${k ? k.ime : naziv}` : `${tip}: ${naziv}`;
  try{
    let eventResource;
    const _vt1=parseVreme(vreme);
    if(_vt1){
      const {hh,mm}=_vt1;
      const start=`${iso}T${hh}:${mm}:00`;
      const endD=new Date(`${iso}T${hh}:${mm}:00`);
      endD.setHours(endD.getHours()+1);
      const end = `${iso}T${String(endD.getHours()).padStart(2,'0')}:${String(endD.getMinutes()).padStart(2,'0')}:00`;
      eventResource = { summary: fullNaziv, start:{dateTime:start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, end:{dateTime:end,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, colorId: tip==='Ročište'?'11':'7' };
    } else {
      eventResource = { summary: fullNaziv, start:{dateTime:`${iso}T09:00:00`,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, end:{dateTime:`${iso}T09:30:00`,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, colorId: tip==='Ročište'?'11':'7' };
    }
    if(p){ eventResource.description = `Predmet: ${p.interni}\nKlijent: ${k?k.ime:''}\nSud: ${p.sud||''}`; }
    const resp = await gapi.client.calendar.events.insert({ calendarId:'primary', resource:eventResource });
    // Ako je predmet izabran - linkuj i upiši datum ročišta
    if(p && tip === 'Ročište'){
      p.rociste = iso;
      const links = gGetLinks();
      links[resp.result.id] = predmetId;
      gSaveLinks(links);
      saveDB();
    } else if(p){
      const links = gGetLinks();
      links[resp.result.id] = predmetId;
      gSaveLinks(links);
    }
    await gLoadCalendarEvents();
    // Resetuj formu
    document.getElementById('new_ev_naziv').value='';
    document.getElementById('new_ev_datum').value='';
    document.getElementById('new_ev_vreme').value='';
    document.getElementById('new_ev_predmet').value='';
    renderPage();
  } catch(e){
    alert('Greška: ' + (e.result?.error?.message || e.message));
  }
}

  if(!predmet.rociste){ alert('Predmet nema zakazano ročište.'); return; }
  const k = getKlijent(predmet.klijentId);
  const startDate = predmet.rociste; // YYYY-MM-DD
  try{
    const event = {
      summary: `Ročište: ${predmet.interni} — ${k.ime}`,
      description: `Predmet: ${predmet.interni}\nKlijent: ${k.ime}\nSud: ${predmet.sud}\nProtivna strana: ${predmet.protivna||'—'}\nOpis: ${predmet.opis||'—'}`,
      location: predmet.sud,
      start: { dateTime: `${startDate}T09:00:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
      end: { dateTime: `${startDate}T09:30:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
      colorId: '11', // tomato red
      reminders: {
        useDefault: false,
        overrides: [
          { method: 'email', minutes: 24*60 },
          { method: 'popup', minutes: 60 }
        ]
      }
    };
    await gapi.client.calendar.events.insert({ calendarId: 'primary', resource: event });
    await gLoadCalendarEvents();
    alert('✓ Ročište dodato u Google Calendar!');
    if(currentPage==='google') renderPage();
  } catch(e){
    alert('Greška: ' + (e.result?.error?.message || e.message));
  }
}

async function gDeleteCalEvent(eventId){
  if(!gIsSignedIn){ alert('Niste prijavljeni na Google.'); return; }
  // Custom confirm dialog
  const confirmed = await new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'shutdown-overlay';
    el.innerHTML = `
      <div class="shutdown-box" style="text-align:center">
        <div style="font-size:28px;margin-bottom:10px">🗑️</div>
        <p style="font-weight:600;margin-bottom:6px">Obrisati događaj?</p>
        <p style="font-size:12px;color:var(--text3);margin-bottom:18px">Događaj će biti obrisan iz Google Calendara.</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-secondary" onclick="this.closest('.shutdown-overlay').remove();arguments[0].resolve(false)" 
            onclick2="">Otkaži</button>
          <button class="btn btn-danger" onclick="this.closest('.shutdown-overlay').remove();">Obriši</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    el.querySelectorAll('button')[0].onclick = () => { el.remove(); resolve(false); };
    el.querySelectorAll('button')[1].onclick = () => { el.remove(); resolve(true); };
  });
  if(!confirmed) return;
  try{
    await gapi.client.calendar.events.delete({
      calendarId: 'primary',
      eventId: eventId
    });
    const links = gGetLinks();
    if(links[eventId]){
      const p = getPredmet(links[eventId]);
      if(p){ p.rociste=''; saveDB(); }
      delete links[eventId];
      gSaveLinks(links);
    }
    await gLoadCalendarEvents();
    renderPage();
  } catch(e){
    if(e.status===401){
      alert('Sesija je istekla. Odjavite se i prijavite ponovo.');
      gSignOut();
    } else {
      alert('Greška: ' + (e.result?.error?.message || e.message));
    }
  }
}

function fmtGCalDate(ev){
  const d = ev.start?.dateTime || ev.start?.date;
  if(!d) return '';
  const dt = new Date(d);
  if(ev.start?.dateTime){
    return dt.toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit'}) + ' ' +
           dt.toLocaleTimeString('sr-RS',{hour:'2-digit',minute:'2-digit'});
  }
  return dt.toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric'});
}

async function saveEditEvent(){
  const eventId=editId;
  const ev=gCalendarEvents.find(e=>e.id===eventId);
  if(!ev) return;
  let naziv=(document.getElementById('edit_ev_naziv')?.value||'').trim();
  if(!naziv){alert('Unesite naziv!');return;}
  const isPrivatno=document.getElementById('tip_privatno')?.checked;
  const datumRaw=document.getElementById('edit_ev_datum')?.value?.trim()||'';
  const vremeRaw=document.getElementById('edit_ev_vreme')?.value?.trim()||'';
  const noviPredmetId=document.getElementById('edit_ev_predmet')?.value||'';
  const prefixes=['Privatno: ','Ročište: ','Rok: ','Konsultacije: ','Sastanak: '];
  let cleanNaziv=naziv;
  prefixes.forEach(p=>{if(cleanNaziv.startsWith(p))cleanNaziv=cleanNaziv.slice(p.length);});
  const finalNaziv=isPrivatno?'Privatno: '+cleanNaziv:cleanNaziv;
  const colorId=isPrivatno?'8':'11';
  const resource={summary:finalNaziv,colorId};
  if(datumRaw){
    const parts=datumRaw.split('/');
    if(parts.length===3){
      const iso=`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      const _vt=parseVreme(vremeRaw);
      if(_vt){
        const startDT=`${iso}T${_vt.hh}:${_vt.mm}:00`;
        const endD=new Date(`${iso}T${_vt.hh}:${_vt.mm}:00`);endD.setHours(endD.getHours()+1);
        const endHH=String(endD.getHours()).padStart(2,'0');const endMM=String(endD.getMinutes()).padStart(2,'0');
        const endDT=`${iso}T${endHH}:${endMM}:00`;
        resource.start={dateTime:startDT,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};
        resource.end={dateTime:endDT,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};
      } else {
        resource.start={date:iso};resource.end={date:iso};
      }
    }
  }
  try{
    await gapi.client.calendar.events.patch({calendarId:'primary',eventId,resource});
    const links=gGetLinks();
    const oldPid=gLinkPredmetId(links[eventId]);
    if(oldPid&&oldPid!==noviPredmetId) delete links[eventId];
    if(noviPredmetId) links[eventId]=noviPredmetId;
    // Ako je predmet vezan i datum je promenjen, ažuriraj p.rociste
    const linkedPid = noviPredmetId || oldPid;
    if(linkedPid && resource.start){
      const linkedP = getPredmet(linkedPid);
      const noviDatum = resource.start.date || (resource.start.dateTime||'').slice(0,10);
      if(linkedP && noviDatum) linkedP.rociste = noviDatum;
    }
    gSaveLinks(links); saveDB();
    await gLoadCalendarEvents(); closeModal(); renderPage();
  }catch(e){alert('Greška: '+(e.result?.error?.message||e.message));}
}

// Privatno = sivo, sve ostalo (poslovno) = crveno
function isPrivatniDogadjaj(item){
  if(!item.fromGCal) return false; // predmeti su uvek poslovni
  const n = normalizeStr(item.naziv||'');

  // Ako naziv sadrži poslovne ključne reči — uvek poslovno
  const poslovneReci = ['rociste','konsultacije','konsultacija','rok','sudjenje',
    'pretres','rasprava','sednica','sjednica','narociste','advokat','sud','tuzba',
    'predmet','ugovor','sporazum','nagodba','pritvor','saslusanje','vestacenje',
    'izvrsenje','privremena mera','obezbedjenje','zalba','revizija','parnica',
    'krivicna','krivicni','krivicno','upravni','upravna','upravno',
    'zastupanje','zastupnik','punomocje','punomocnik','punomocnik',
    'izjava','podnesak','tuzilac','tuzilacki','tuzilastvo','javni tuzilac',
    'optuznica','optuzba','oslobadjanje','presuda','resenje','nalog',
    'prigovor','molba','zahtev','predlog','prituzba','predstavka',
    'notarski','notar','katastar','upis','registracija','osnivanje',
    'likvidacija','stecaj','izvod','prepis','overavanje','overa',
    'policija','mup','carina','poreska','poreska uprava','inspekcija',
    'prekrsaj','privredni','privreda','hipoteka','zalozno','zalog',
    'naknada','odšteta','odsteta','eksproprijacija','nacionalizacija'];
  if(poslovneReci.some(r=>n.includes(r))) return false;

  const ev = gCalendarEvents.find(e=>e.id===item.evId);
  if(!ev) return true; // nepoznat event = privatno

  // Birthday/godišnjica iz Google kontakata
  if(ev.eventType==='birthday') return true;
  if(ev.organizer?.displayName?.toLowerCase().includes('birthday')) return true;
  if(ev.organizer?.email?.includes('calendar.google.com') && ev.organizer?.email?.includes('birthday')) return true;

  // Graphite boja = privatno
  if(ev.colorId==='8') return true;

  // Ako je povezan sa predmetom = poslovno
  const links = gGetLinks();
  if(links[ev.id]) return false;

  // Sve ostalo = privatno
  return true;
}

function _isDjecji(naziv){

function stampajKalendar(tip){
  const st=_getStamp();
  const links=gGetLinks();
  const dani=['nedjelja','ponedeljak','utorak','sreda','cetvrtak','petak','subota'];
  const svi=[...gCalendarEvents].sort((a,b)=>new Date(a.start?.dateTime||a.start?.date||'')-new Date(b.start?.dateTime||b.start?.date||''));
  const lista=svi.filter(ev=>{
    const naziv=ev.summary||'';
    const djecki=_isDjecji(naziv);
    if(tip==='sve') return !djecki;
    if(tip==='novi'){
      if(!st) return true;
      const ref=new Date(st.iso);
      const u=ev.updated?new Date(ev.updated):null;
      const c=ev.created?new Date(ev.created):null;
      return (u&&u>ref)||(c&&c>ref&&!u);
    }
    return true;
  });
  const naslov=tip==='novi'?('Novi unosi od '+(st?st.prikaz:'pocetka')):'Kalendar';
  const sada=new Date().toLocaleString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const grupe={};
  lista.forEach(ev=>{ const d=(ev.start?.dateTime||ev.start?.date||'').slice(0,10); if(!grupe[d])grupe[d]=[]; grupe[d].push(ev); });
  let sadrzaj='';
  if(!lista.length){ sadrzaj='<p style="color:#888;font-style:italic">Nema dogadjaja.</p>'; }
  else {
    Object.keys(grupe).sort().forEach(datum=>{
      const pp=datum.split('-');
      const dp=pp.length===3?pp[2]+'.'+pp[1]+'.'+pp[0]+'.':datum;
      sadrzaj+='<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#444;border-bottom:1px solid #ccc;padding-bottom:3px;margin-bottom:5px">'+dp+'</div>';
      grupe[datum].forEach(ev=>{
        let vreme='';
        if(ev.start&&ev.start.dateTime){ const dd=new Date(ev.start.dateTime); vreme=String(dd.getHours()).padStart(2,'0')+':'+String(dd.getMinutes()).padStart(2,'0'); }
        const naziv=ev.summary||'(bez naslova)';
        const pid=gLinkPredmetId(links[ev.id]||null);
        const p=pid?db.predmeti.find(x=>x.id===pid):null;
        const k=p?db.klijenti.find(x=>x.id===p.klijentId):null;
        sadrzaj+='<div style="display:flex;gap:10px;padding:3px 0;font-size:13px;border-bottom:1px dotted #eee"><span style="width:40px;flex-shrink:0;font-weight:600">'+(vreme||'&#8212;')+'</span><span style="flex:1">'+naziv+(p?' <span style="color:#777;font-size:11px">('+p.interni+(k?' &#8212; '+k.ime:'')+')</span>':'')+'</span></div>';
      });
      sadrzaj+='</div>';
    });
  }
  const meta='Stampano: '+sada+(st&&tip!=='novi'?' | Prethodno: '+st.prikaz:'')+' | Ukupno: '+lista.length;
  const _blobHtml=('<!DOCTYPE html><html><head><title>'+naslov+'</title><style>body{font-family:serif;padding:36px 48px;font-size:13px;color:#111}h2{font-size:17px;margin-bottom:4px}.meta{font-size:11px;color:#888;margin-bottom:20px}@media print{.np{display:none}body{padding:20px}}</style></head><body><h2>'+naslov+'</h2><div class="meta">'+meta+'</div>'+sadrzaj+'<br><button class="np" onclick="window.print()" style="padding:8px 20px;font-size:14px;cursor:pointer">Stampaj</button></body></html>');
  const _blob=new Blob([_blobHtml],{type:'text/html;charset=utf-8'});
  const _blobUrl=URL.createObjectURL(_blob);
  const w=window.open(_blobUrl,'_blank','width=780,height=800');
  if(!w){alert('Browser je blokirao popup. Dozvolite popups za ovu stranicu.');return;}
  setTimeout(()=>URL.revokeObjectURL(_blobUrl),60000);
  _setStamp();
  renderPage();
}

      return{fromGCal:true,evId:ev.id,naziv:ev.summary||'',p,k,date,privatno};

  ];
  const ukupnoDug=dugovanja.reduce((a,f)=>a+(f.fakturisano-f.placeno),0);

  const links=gGetLinks();
  const today2=new Date();today2.setHours(0,0,0,0);
  const weekEnd2=new Date(today2);weekEnd2.setDate(today2.getDate()+7);

  // Svi GCal događaji u narednih 7 dana (bez linka i sa linkom)
  const gcalSvi=gCalendarEvents.filter(ev=>{
    const d=(ev.start?.dateTime||ev.start?.date||'').slice(0,10);
    if(!d)return false;
    const dt=new Date(d);dt.setHours(0,0,0,0);
    return dt>=today2&&dt<=weekEnd2;
  }).map(ev=>{
    const _lnk=links[ev.id]||null;
    const predmetId=gLinkPredmetId(_lnk);
    const _klId=gLinkKlijentId(_lnk);
    const p=predmetId?getPredmet(predmetId):null;
    const k=p?getKlijent(p.klijentId):(_klId?getKlijent(_klId):null);
    const date=(ev.start?.dateTime||ev.start?.date||'').slice(0,10);
    return{fromGCal:true,evId:ev.id,naziv:ev.summary||'',p,k,date,days:daysUntil(date)};
  });

  // Ročišta iz predmeta koja NISU u GCal
  const gcalDates=new Set(Object.keys(links).map(eid=>{
    const ev=gCalendarEvents.find(e=>e.id===eid);
    return ev?(links[eid]+'_'+(ev.start?.dateTime||ev.start?.date||'').slice(0,10)):null;
  }).filter(Boolean));
  const predmetRocista=db.predmeti.filter(p=>{
    if(!p.rociste)return false;
    const d=daysUntil(p.rociste);
    if(d===null||d<0||d>7)return false;
    return!gcalDates.has(p.id+'_'+p.rociste);
  }).map(p=>{
    const k=getKlijent(p.klijentId);
    return{fromGCal:false,p,k,date:p.rociste,days:daysUntil(p.rociste)};
  });

  const svaRocista=[...gcalSvi,...predmetRocista].sort((a,b)=>new Date(a.date)-new Date(b.date));
  window._dashRocista = svaRocistaKalendar; // koristimo svu listu za klik na datum
  const rocistaCount=svaRocista.length;
  const todayStr=new Date().toISOString().slice(0,10);
  const danasCount=svaRocista.filter(item=>item.date===todayStr).length;

  return`
  <div class="dash-top-grid" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px;margin-bottom:24px">

    <div class="stat-card" style="${(()=>{ const sutraStr=new Date(new Date().getTime()+24*60*60*1000).toISOString().slice(0,10); const d=svaRocista.filter(i=>i.date===todayStr).length; if(d>0) return 'border:2px solid var(--danger);background:var(--danger-bg);box-shadow:0 0 0 5px rgba(220,53,69,.09),var(--shadow)'; if(svaRocista.filter(i=>i.date===sutraStr).length>0) return 'border:2px solid var(--warn);background:var(--warn-bg);box-shadow:0 0 0 5px rgba(255,152,0,.09),var(--shadow)'; return 'border:2px solid var(--border)'; })()}">

        const sutraStr = new Date(new Date().getTime()+24*60*60*1000).toISOString().slice(0,10);
        const danasItems = svaRocista.filter(item=>item.date===todayStr);
        const sutraItems = svaRocista.filter(item=>item.date===sutraStr);
        function renderAktItem(item, accent){
          const privatno = isPrivatniDogadjaj(item);
          const boja = privatno ? 'var(--text3)' : accent;
          const naziv = item.fromGCal
            ? (item.p ? `${item.p.interni} — ${item.k?item.k.ime:''}` : item.naziv)
            : `${item.p.interni} — ${item.k.ime}`;
          const podNaziv = item.fromGCal && item.p && item.naziv ? item.naziv : '';
          const protivnaStr = item.p?.protivna ? 'vs. ' + item.p.protivna : '';
          const tipIkona = privatno ? '🏠' : (item.fromGCal
            ? (item.naziv.startsWith('Konsultacije')?'💬':'⚖')
            : '⚖');
          let vremeStr = '';
          if(item.fromGCal){
            const ev = gCalendarEvents.find(e=>e.id===item.evId);
            if(ev?.start?.dateTime){
              const d=new Date(ev.start.dateTime);
              vremeStr = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
            }
          } else if(item.p?.rocisteVreme){
            vremeStr = item.p.rocisteVreme;
          }
          const border2 = privatno ? 'var(--border2)' : accent;
          const editBtn = item.fromGCal
            ? `<button class="btn btn-sm" style="background:transparent;border:1px solid var(--border2);color:var(--text2);flex-shrink:0" onclick="event.stopPropagation();openEditEventModal('${item.evId}')" title="Izmeni">✏</button>
               <button class="btn btn-sm" style="background:transparent;border:1px solid ${border2};color:${border2};flex-shrink:0" onclick="event.stopPropagation();gDeleteEventById('${item.evId}')">✕</button>`
            : `<button class="btn btn-sm" style="background:transparent;border:1px solid ${border2};color:${border2};flex-shrink:0" onclick="event.stopPropagation();deleteRocisteFromPredmet('${item.p.id}')">✕</button>`;
          const _klikAttr = (!privatno && item.p) ? `onclick="event.stopPropagation();navigate('predmeti','${item.p.id}')" title="Otvori karticu predmeta"` : '';
          const _nazivBoja = (!privatno && item.p) ? 'var(--accent)' : (privatno?'var(--text2)':'var(--text)');
          const _nazivDecor = (!privatno && item.p) ? 'text-decoration:underline dotted;cursor:pointer;' : '';
          return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);opacity:${privatno?'.55':'1'}">
            <span style="font-size:15px;flex-shrink:0">${tipIkona}</span>
            <span ${_klikAttr} style="flex:1;min-width:0;color:${_nazivBoja};${_nazivDecor}">
              <div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(naziv)}</div>
              ${(podNaziv||protivnaStr)?`<div style="font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px">${podNaziv?esc(podNaziv):''}${podNaziv&&protivnaStr?' · ':''}${protivnaStr?esc(protivnaStr):''}</div>`:''}
            </span>
            ${vremeStr?`<span style="flex-shrink:0;font-size:13px;font-weight:700;color:${boja};background:${boja}22;padding:2px 8px;border-radius:20px">${vremeStr}</span>`:''}
            <div style="display:flex;gap:4px;flex-shrink:0">${editBtn}</div>
          </div>`;
        }
        if(danasItems.length===0 && sutraItems.length===0){
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <div class="stat-label">Danas i sutra</div>
            </div>
            <div class="stat-value" style="color:var(--text3)">0</div>
            <div class="stat-sub">nema zakazanih aktivnosti</div>`;
        }
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div class="stat-label" style="margin:0">Danas i sutra</div>
            <div style="display:flex;gap:8px;align-items:center">
              <button onclick="openGCalEventModal()" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer">+ Aktivnost</button>
              ${danasItems.length>0?`<span style="background:var(--danger-bg);color:var(--danger);font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px">● danas: ${danasItems.length}</span>`:''}
              ${sutraItems.length>0?`<span style="background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px">sutra: ${sutraItems.length}</span>`:''}
            </div>
          </div>
          ${danasItems.length>0?`
            <div style="margin-bottom:${sutraItems.length>0?'12px':'0'}">
              <div style="font-size:10px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Danas</div>
              ${danasItems.map(item=>renderAktItem(item,'var(--danger)')).join('')}
            </div>`:''}
          ${sutraItems.length>0?`
            <div>
              <div style="font-size:10px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;${danasItems.length>0?'margin-top:4px':''}">Sutra</div>
              ${sutraItems.map(item=>renderAktItem(item,'var(--warn)')).join('')}
            </div>`:''}
          <div style="font-size:11px;color:var(--text3);margin-top:8px">ukupno ${rocistaCount} u narednih 7 dana</div>
        `;
      })()}
    </div>

    <div class="stat-card">
      <div class="stat-label">Aktivni predmeti</div>
      <div class="stat-value">${aktivni}</div>
      <div class="stat-sub">od ${db.predmeti.length} ukupno</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Ukupna potraživanja</div>
      <div class="stat-value" style="color:var(--danger);font-size:20px">${fmtMoney(ukupnoDug)}</div>
      <div class="stat-sub">${dugovanja.length} neplaćenih faktura</div>
      <div class="stat-sub" style="margin-top:6px;line-height:1.5">Potraživanja prema klijentima koji su obavešteni o dugovanjima i prema državnim organima po donetim rešenjima.</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ukupno naplaćeno</div>
      <div class="stat-value" style="color:var(--success);font-size:20px">${fmtMoney(ukupnoNapl)}</div>
      <div class="stat-sub">ove godine</div>
    </div>
  </div>
  
  <div class="grid-2" style="margin-bottom:24px">
    <div class="card">
      <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
        <span>📅 Kalendar</span>
        ${danasCount>0?`<span style="background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:600">● danas: ${danasCount}</span>`:''}
      </div>
      ${(()=>{
        const now=new Date();
        const todayY=now.getFullYear(), todayMo=now.getMonth(), todayD=now.getDate();
        const yr=dashCalYear, mo=dashCalMonth;
        const meseci=['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
        const dani=['Po','Ut','Sr','Če','Pe','Su','Ne'];
        const firstDay=new Date(yr,mo,1).getDay();
        const offset=firstDay===0?6:firstDay-1;
        const ukupnoDana=new Date(yr,mo+1,0).getDate();
        const eventsByDay={};
        svaRocistaKalendar.forEach(item=>{
          const d=new Date(item.date+'T12:00:00');
          if(d.getMonth()===mo&&d.getFullYear()===yr){
            const day=d.getDate();
            if(!eventsByDay[day])eventsByDay[day]=[];
            const naziv=item.fromGCal?(item.p?item.p.interni+' — '+(item.k?item.k.ime:''):item.naziv):(item.p.interni+' — '+item.k.ime);
            const privatno=isPrivatniDogadjaj(item);
            eventsByDay[day].push({naziv, privatno});
          }
        });
        const eventDays=new Set(Object.keys(eventsByDay).map(Number));
        let cells=dani.map(d=>`<div style="text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0">${d}</div>`).join('');
        for(let i=0;i<offset;i++)cells+=`<div></div>`;
        for(let d=1;d<=ukupnoDana;d++){
          const isToday=d===todayD&&mo===todayMo&&yr===todayY;
          const hasEv=eventDays.has(d);
          const iso=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          const dayEvs=eventsByDay[d]||[];
          const tooltip=dayEvs.map(e=>e.naziv).join('\n');
          const hasBusin=dayEvs.some(e=>!e.privatno);
          const hasPriv=dayEvs.some(e=>e.privatno);
          const dots=hasEv?`<div style="display:flex;gap:2px;justify-content:center;position:absolute;bottom:2px;left:50%;transform:translateX(-50%)">${hasBusin?`<div style="width:5px;height:5px;border-radius:50%;background:${isToday?'#fff':'var(--danger)'}"></div>`:''}${hasPriv?`<div style="width:5px;height:5px;border-radius:50%;background:${isToday?'#fff':'var(--text3)'}"></div>`:''}</div>`:'';
          cells+=`<div onclick="dashCalSelect('${iso}')" title="${tooltip}" style="text-align:center;padding:5px 2px;border-radius:6px;cursor:pointer;font-size:13px;position:relative;transition:background .1s;${isToday?'background:var(--accent);color:#fff;font-weight:700;':'color:var(--text);'}" onmouseover="if(!this.dataset.sel)this.style.background='var(--surface2)'" onmouseout="if(!this.dataset.sel)this.style.background='${isToday?'var(--accent)':'transparent'}'">${d}${dots}</div>`;
        }
        return `<div style="margin-bottom:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <button onclick="dashCalNav(-1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);padding:2px 8px;border-radius:var(--radius);transition:background .15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">‹</button>
            <span style="font-weight:600;font-size:13px;color:var(--text2)">${meseci[mo]} ${yr}</span>
            <button onclick="dashCalNav(1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);padding:2px 8px;border-radius:var(--radius);transition:background .15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">›</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
        </div>`;
      })()}

      <!-- Lista događaja za izabrani dan -->
      <div id="dash-cal-events" style="border-top:1px solid var(--border);padding-top:10px">
        ${(()=>{
          const items=svaRocista.filter(item=>item.date===todayStr);
          if(items.length===0)return`<div style="color:var(--text3);font-size:13px">Danas nema događaja.</div>`;
          return`<div style="font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Danas</div>`+
          items.map(item=>renderCalEvent(item)).join('');
        })()}
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
        <span>✅ Google Tasks</span>
        <button class="btn btn-secondary btn-sm" onclick="navigate('google')">Svi zadaci</button>
      </div>
      ${!gIsSignedIn ? `
        <div style="color:var(--text3);font-size:13px;padding:8px 0">Povežite Google nalog za prikaz zadataka.</div>
      ` : gTasks.filter(t=>t.status!=='completed').length===0 && gTasks.filter(t=>t.status==='completed').length===0 ? `
        <div style="color:var(--text3);font-size:13px;padding:8px 0">Nema zadataka.</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="dash_task_input" placeholder="Novi zadatak..." style="flex:1;font-size:13px" onkeydown="if(event.key==='Enter'){dashAddTask();event.preventDefault()}">
          <button class="btn btn-primary btn-sm" onclick="dashAddTask()">+</button>
        </div>
      ` : `
        ${(()=>{
          const aktivni=gTasks.filter(t=>t.status!=='completed');
          const prikazani=dashTasksExpanded?aktivni:aktivni.slice(0,8);
          const ostalo=aktivni.length-8;
          return `
          ${prikazani.map(t=>`
          <div class="gtask-item">
            <div class="gtask-check" onclick="gToggleTask('${t.id}', false)" title="Označi kao završeno">
              <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2 6 5 9 10 3"/></svg>
            </div>
            <div style="flex:1;font-size:13.5px">${esc(t.title)}</div>
            ${t.due?`<div style="font-size:11px;color:var(--text3);margin-right:4px">${new Date(t.due).toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit'})}</div>`:''}
            <button onclick="gEditTask('${t.id}',${JSON.stringify(t.title)})" title="Izmeni" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px 4px;border-radius:4px;flex-shrink:0" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text3)'">✏</button>
            <button onclick="gDeleteTask('${t.id}')" title="Obriši zadatak" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;flex-shrink:0" onmouseover="this.style.color='var(--danger)';this.style.background='var(--danger-bg)'" onmouseout="this.style.color='var(--text3)';this.style.background='none'">✕</button>
          </div>`).join('')}
          ${aktivni.length>8?`
          <button onclick="dashTasksExpanded=!dashTasksExpanded;renderPage()" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--accent);padding:4px 0;width:100%;text-align:left">
            ${dashTasksExpanded?'▲ Skupi':'▼ Prikaži još '+(ostalo)+' zadataka'}
          </button>`:''}`;
        })()}
        ${gTasks.filter(t=>t.status==='completed').length>0?`
          <div style="font-size:11px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${gTasks.filter(t=>t.status==='completed').length} završenih zadataka</div>
        `:''}
        <div style="display:flex;gap:8px;margin-top:10px">
          <input id="dash_task_input" placeholder="Novi zadatak..." style="flex:1;font-size:13px" onkeydown="if(event.key==='Enter'){dashAddTask();event.preventDefault()}">
          <button class="btn btn-primary btn-sm" onclick="dashAddTask()">+</button>
        </div>
      `}
    </div>
  </div>
  
  ${gIsSignedIn && gCalendarEvents.length>0 ? `
  <div class="card" style="margin-bottom:24px">
    <div style="font-weight:600;font-size:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
      <span>📅 Narednih 7 dana</span>
      <button class="btn btn-secondary btn-sm" onclick="navigate('google')">Svi događaji</button>
    </div>
    ${(()=>{
      const now = new Date(); now.setHours(0,0,0,0);
      const weekEnd = new Date(now); weekEnd.setDate(now.getDate()+7);
      const sedmica = gCalendarEvents.filter(ev=>{
        const d = new Date((ev.start?.dateTime||ev.start?.date||'').slice(0,10)+'T12:00:00');
        return d>=now && d<weekEnd;
      });
      if(sedmica.length===0) return '<div style="color:var(--text3);font-size:13px">Nema događaja u narednih 7 dana.</div>';

      // Group by date for headers
      const grouped={};
      sedmica.forEach(ev=>{
        const d=(ev.start?.dateTime||ev.start?.date||'').slice(0,10);
        if(!grouped[d])grouped[d]=[];
        grouped[d].push(ev);
      });

      const daniSr=['Ned','Pon','Uto','Sre','Čet','Pet','Sub'];
      const meseci=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
      const todayStr=new Date().toISOString().slice(0,10);

      return Object.keys(grouped).sort().map(date=>{
        const dt=new Date(date+'T12:00:00');
        const isToday=date===todayStr;
        const datLabel=isToday?'Danas':(daniSr[dt.getDay()]+', '+dt.getDate()+'. '+meseci[dt.getMonth()]+'.');
        const evHTML=grouped[date].map(ev=>{
          // Determine if private
          const n=(ev.summary||'').toLowerCase();
          const privatno=n.startsWith('privatno')||ev.colorId==='8';
          const bg=privatno?'var(--surface3)':'var(--danger-bg)';
          const border=privatno?'var(--border2)':'var(--danger)';
          const ikona=privatno?'🏠':'⚖';
          const vremeStr=ev.start?.dateTime?String(new Date(ev.start.dateTime).getHours()).padStart(2,'0')+':'+String(new Date(ev.start.dateTime).getMinutes()).padStart(2,'0'):'';
          const links=gGetLinks();
          const pid=gLinkPredmetId(links[ev.id]);
          const p=pid?getPredmet(pid):null;
          const k=p?getKlijent(p.klijentId):null;
          const prikazIme=k?k.ime:ev.summary||'(bez naslova)';
          const onclick=p?`navigate('predmeti','${p.id}')`:``;
          return`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:${bg};border-left:3px solid ${border};border-radius:var(--radius);margin-bottom:6px;${onclick?'cursor:pointer':''}" ${onclick?`onclick="${onclick}"`:''}>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(prikazIme)}</div>
              <div style="font-size:11.5px;color:var(--text2);margin-top:1px">${ikona} ${esc((ev.summary||'').split(':')[0])}${vremeStr?' · <strong>'+vremeStr+'</strong>':''}</div>
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0">
              <button class="btn btn-sm" style="background:transparent;border:1px solid var(--border2);color:var(--text2)" onclick="event.stopPropagation();openEditEventModal('${ev.id}')" title="Izmeni">✏</button>
              <button class="btn btn-sm" style="background:transparent;border:1px solid ${border};color:${border}" onclick="event.stopPropagation();gDeleteEventById('${ev.id}')">✕</button>
            </div>
          </div>`;
        }).join('');
        return`<div style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:${isToday?'var(--accent)':'var(--text3)'};text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${datLabel}</div>
          ${evHTML}
        </div>`;
      }).join('');
    })()}
  </div>` : ''}
`;
}

// Normalizacija za pretragu - uklanja dijakritike i sortira reči
function normalizeSearch(str){
  if(!str) return '';
  return str.toLowerCase()
    .replace(/[čć]/g,'c')
    .replace(/[š]/g,'s')
    .replace(/[ž]/g,'z')
    .replace(/[đ]/g,'dj')
    .replace(/[ä]/g,'a')
    .replace(/[ö]/g,'o')
    .replace(/[ü]/g,'u');
}
function searchMatch(haystack, needle){
  if(!needle) return true;
  const h = normalizeSearch(haystack);
  // Podeli upit na reči i traži svaku
  const words = normalizeSearch(needle).trim().split(/\s+/);
  return words.every(w => h.includes(w));
}

function _modalKeyHandler(e){
  if(e.key==='Escape'){e.preventDefault();if(_calActive){closeCal();}else{closeModal();}return}
  if(e.key==='Enter'){
    // Only trigger on Enter if focus is NOT on textarea or select (allow normal newline/select behavior)
    const tag=document.activeElement?.tagName;
    if(tag==='TEXTAREA'||tag==='SELECT')return;
    e.preventDefault();
    saveModal();
  }
}
function kartUrediUnos(predmetId, idx){

  const novi = prompt('Uredi unos:', p.opisDnevnik[idx].tekst);
  if(novi===null) return;
  p.opisDnevnik[idx].tekst = novi.trim();
  p.opis = p.opisDnevnik[p.opisDnevnik.length-1].tekst;
  saveDB(); renderPage();

  const p = db.predmeti.find(x=>x.id===predmetId);

function _nadjiDatumeUTekstu(tekst){
  // Detektuje formate: 10.06.2026, 10.6.2026, 10/06/2026, 2026-06-10
  const rezultati = [];
  const patterns = [
    /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g,
    /\b(\d{4})-(\d{2})-(\d{2})\b/g,
  ];
  let m;
  const today = new Date(); today.setHours(0,0,0,0);
  // dd.mm.yyyy
  const re1 = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g;
  while((m=re1.exec(tekst))!==null){
    const iso = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d = new Date(iso+'T12:00:00');
    if(!isNaN(d) && d >= today) rezultati.push({iso, prikaz:`${m[1].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[3]}`});
  }
  // yyyy-mm-dd
  const re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m=re2.exec(tekst))!==null){
    const iso = `${m[1]}-${m[2]}-${m[3]}`;
    const d = new Date(iso+'T12:00:00');
    if(!isNaN(d) && d >= today) rezultati.push({iso, prikaz:`${m[3]}.${m[2]}.${m[1]}`});
  }
  // deduplikacija
  const seen = new Set();
  return rezultati.filter(r=>{ if(seen.has(r.iso)) return false; seen.add(r.iso); return true; });
}

function brziUnosOpisa(predmetId){
  const p = db.predmeti.find(x=>x.id===predmetId);
  if(!p) return;
  const datum = document.getElementById('brziOpisDatum_'+predmetId)?.value || new Date().toISOString().slice(0,10);
  const tekst = document.getElementById('brziOpisTekst_'+predmetId)?.value?.trim();
  if(!tekst){ alert('Unesite tekst.'); return; }
  if(!p.opisDnevnik) p.opisDnevnik = [];
  if(p.opisDnevnik.length===0 && p.opis) p.opisDnevnik.push({datum:'(raniji)', tekst:p.opis});
  p.opisDnevnik.push({datum, tekst});
  p.opis = tekst;
  saveDB();

  // Detektuj datume u tekstu
  const nadjeni = _nadjiDatumeUTekstu(tekst);
  if(nadjeni.length > 0 && gIsSignedIn){
    _ponudiZakazivanje(predmetId, nadjeni, tekst);
  } else {
    renderPage();
