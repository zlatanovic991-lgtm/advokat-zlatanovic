      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label style="font-size:12px;color:var(--text2)">Opis obaveze</label>
        <input type="text" id="_zakazOpis" placeholder="npr. Udariti klauzulu, poslati zahtev..." value="" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13px">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="_zakazSkip" class="btn btn-secondary">Preskoči</button>
        <button id="_zakazDodaj" class="btn btn-primary">+ Dodaj u kalendar</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);

  document.getElementById('_zakazSkip').onclick = ()=>{ document.body.removeChild(overlay); renderPage(); };
  document.getElementById('_zakazDodaj').onclick = async ()=>{
    const iso = document.getElementById('_zakazDatum').value;
    const vreme = document.getElementById('_zakazVreme').value;
    const opis = document.getElementById('_zakazOpis').value.trim() || 'Obaveza';
    const naziv = p ? `${opis} — ${p.interni}${k?' ('+k.ime+')':''}` : opis;
    document.body.removeChild(overlay);
    try{
      let resource;
      if(vreme){
        const start = `${iso}T${vreme}:00`;
        const endD = new Date(start); endD.setHours(endD.getHours()+1);
        const end = `${iso}T${String(endD.getHours()).padStart(2,'0')}:${String(endD.getMinutes()).padStart(2,'0')}:00`;
        resource = {summary:naziv, start:{dateTime:start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, end:{dateTime:end,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}, colorId:'7'};
      } else {
        resource = {summary:naziv, start:{date:iso}, end:{date:iso}, colorId:'7'};
      }
      if(p) resource.description = `Predmet: ${p.interni}\nKlijent: ${k?k.ime:''}\nSud: ${p.sud||''}`;
      const resp = await gapi.client.calendar.events.insert({calendarId:'primary', resource});
      if(p){
        const links = gGetLinks();
        links[resp.result.id] = predmetId;
        gSaveLinks(links);
      }
      await gLoadData();
    } catch(e){ console.error(e); alert('Greška pri dodavanju u kalendar.'); }
    renderPage();
  };
}


function opisUredi(idx){
  const p = editId ? db.predmeti.find(x=>x.id===editId) : null;
  if(!p || !p.opisDnevnik || !p.opisDnevnik[idx]) return;
  const u = p.opisDnevnik[idx];
  const fmtD = s => { if(!s||s==='(raniji)') return s||''; const pp=s.split('-'); return pp.length===3?pp[2]+'/'+pp[1]+'/'+pp[0]:s; };
  const noviTekst = prompt('Uredi tekst unosa:', u.tekst);
  if(noviTekst === null) return; // otkazano
  p.opisDnevnik[idx].tekst = noviTekst.trim();
  saveDB();
  // Osvezi modal in-place
  openPredmetModal(editId);
}
function opisObrisi(idx){
  const p = editId ? db.predmeti.find(x=>x.id===editId) : null;
  if(!p || !p.opisDnevnik || !p.opisDnevnik[idx]) return;
  if(!confirm('Obrisati ovaj unos opisa?')) return;
  p.opisDnevnik.splice(idx, 1);
  p.opis = p.opisDnevnik.length>0 ? p.opisDnevnik[p.opisDnevnik.length-1].tekst : '';
  saveDB();
  openPredmetModal(editId);
}

function _getPredmetInfoHTML(){

function selectTipBtn(btn){
  // Reset all
  document.querySelectorAll('.tip-btn').forEach(b=>{
    b.classList.remove('active');
    b.style.border='1px solid var(--border)';
    b.style.background='var(--surface)';
    b.style.color='var(--text2)';
    b.style.fontWeight='500';
  });
  // Activate selected
  btn.classList.add('active');
  btn.style.border='2px solid var(--accent)';
  btn.style.background='var(--accent-light)';
  btn.style.color='var(--accent)';
  btn.style.fontWeight='600';
  const tip = btn.dataset.tip;
  document.getElementById('m_ev_tip').value = tip;
  // Show/hide fields based on type
  const predmetRow = document.getElementById('m_ev_predmet_row');
  const klijentRow = document.getElementById('m_ev_klijent_row');
  const nazivLabel = document.getElementById('m_ev_naziv_label');
  if(tip==='Privatno'){
    predmetRow.style.display='none';
    klijentRow.style.display='none';
    nazivLabel.textContent='Naziv *';
  } else if(tip==='Konsultacije'){
    predmetRow.style.display='none';
    klijentRow.style.display='';
    nazivLabel.textContent='Naziv (opciono)';
  } else {
    predmetRow.style.display='';
    klijentRow.style.display='none';
    nazivLabel.textContent='Naziv (opciono)';
  }
}

// ========== KLIJENT U PREDMETU ==========
let _klijentMode = 'postojeci';

function switchKlijentMode(mode){
  _klijentMode = mode;
  const ep = document.getElementById('klijent_postojeci_panel');
  const np = document.getElementById('klijent_novi_panel');
  const bp = document.getElementById('btn_postojeci');
  const bn = document.getElementById('btn_novi');
  if(mode === 'postojeci'){
    ep.style.display = ''; np.style.display = 'none';
    bp.className = 'btn btn-primary btn-sm'; bn.className = 'btn btn-secondary btn-sm';
  } else {
    ep.style.display = 'none'; np.style.display = '';
    bp.className = 'btn btn-secondary btn-sm'; bn.className = 'btn btn-primary btn-sm';
    document.getElementById('f_klijent_id').value = '';
  }
}

function filterKlijentDropdown(q){
  const dd = document.getElementById('f_klijent_dropdown');
  if(!q||q.length<1){dd.style.display='none';return;}
  const s=q.toLowerCase();
  const matches=db.klijenti.filter(k=>
    searchMatch(k.ime,s)||
    (k.jmbg&&k.jmbg.includes(s))||
    (k.pib&&k.pib.includes(s))||
    (k.telefon&&k.telefon.includes(s))
  ).slice(0,8);
  if(matches.length===0){dd.style.display='none';return;}
  dd.style.display='';
  dd.innerHTML=matches.map(k=>`
    <div onclick="selectKlijent('${k.id}')" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px"
      onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
      <div style="font-weight:500">${esc(k.ime)}</div>
      <div style="font-size:11px;color:var(--text3)">${k.tip==='firma'?'Firma':'Fiz. lice'}${k.jmbg?(k.tip==='firma'?' · MB: '+k.jmbg:' · '+k.jmbg):''}${k.pib?' · PIB: '+k.pib:''}${k.telefon?' · '+k.telefon:''}</div>
    </div>`).join('');
}

function selectKlijent(id){
  const k=db.klijenti.find(x=>x.id===id);
  if(!k)return;
  document.getElementById('f_klijent_id').value=id;
  document.getElementById('f_klijent_search').value='';
  document.getElementById('f_klijent_dropdown').style.display='none';
  const sel=document.getElementById('f_klijent_selected');
  sel.style.display='flex';
  sel.innerHTML=`
    <div>
      <div style="font-weight:600;font-size:13.5px">${esc(k.ime)}</div>
      <div style="font-size:11px;color:var(--text2)">${k.tip==='firma'?'Firma':'Fizičko lice'}${k.jmbg?(k.tip==='firma'?' · MB: '+k.jmbg:' · JMBG: '+k.jmbg):''}${k.pib?' · PIB: '+k.pib:''}${k.telefon?' · '+k.telefon:''}</div>
    </div>
    <button type="button" class="btn btn-secondary btn-sm" onclick="clearSelectedKlijent()" style="flex-shrink:0">✕ Promeni</button>`;
}

function clearSelectedKlijent(){
  document.getElementById('f_klijent_id').value='';
  document.getElementById('f_klijent_selected').style.display='none';
  document.getElementById('f_klijent_search').value='';
  document.getElementById('f_klijent_search').focus();
}

function openPredmetModal(id){
  currentModal='predmet';editId=id||null;
  const p=id?db.predmeti.find(x=>x.id===id):null;
  openModal(id?'Uredi predmet':'Novi predmet',predmetModalBody(p));
  // Init klijent panel
  if(p&&p.klijentId){
    switchKlijentMode('postojeci');
    selectKlijent(p.klijentId);
  } else {
    switchKlijentMode('novi');
  }
  const fi=document.getElementById('f_interni');
  const hint=document.getElementById('f_interni_hint');
  const lbl=document.getElementById('f_interni_label');
  if(p){
    fi.value=p.interni;
    fi.removeAttribute('readonly');
    fi.style.background='';fi.style.color='';
    hint.textContent='Pažnja: izmena internog broja se odražava svuda u aplikaciji';
    hint.style.color='var(--warn)';
    lbl.textContent='Interni broj predmeta';
  } else {
    const vrsta=document.getElementById('f_vrsta')?.value||'parnica';
    fi.value=nextInterniNumber(vrsta);
    fi.setAttribute('readonly','');
    fi.style.background='var(--surface2)';fi.style.color='var(--text3)';
    hint.textContent='Automatski generisan — kliknite na polje za ručni unos';
    hint.style.color='var(--text3)';
    lbl.textContent='Interni broj predmeta (automatski)';
    fi.addEventListener('click',function(){fi.removeAttribute('readonly');fi.style.background='';fi.style.color='';hint.textContent='Ručni unos aktivan';hint.style.color='var(--accent)';},{once:true});
  }
}
function nextInterniNumber(vrsta){
  // Find the highest number across ALL predmeti (simple sequential numbering)
  let max=0;
  db.predmeti.forEach(p=>{
    if(p.interni){
      const num=parseInt(p.interni,10);
      if(!isNaN(num)&&num>max)max=num;
    }
  });
  return String(max+1);
}
function updateInterniPreview(vrsta){
  const fi=document.getElementById('f_interni');
  if(!fi||!fi.hasAttribute('readonly'))return;
  fi.value=nextInterniNumber(vrsta);
}
function deletePredmet(id){
  const p=db.predmeti.find(x=>x.id===id);
  if(!p)return;
  const k=getKlijent(p.klijentId);
  const brAkt=db.aktivnosti.filter(a=>a.predmetId===id).length;
  const brFin=db.finansije.filter(f=>f.predmetId===id).length;
  const brDok=db.dokumenti.filter(d=>d.predmetId===id).length;
  let msg='Obrisati predmet "'+p.interni+'" — '+k.ime+'?';
  if(brAkt||brFin||brDok) msg+='\n\nBiće obrisano i: '+[brAkt?brAkt+' aktivnosti':'',brFin?brFin+' fin. zapisa':'',brDok?brDok+' dokumenata':''].filter(Boolean).join(', ');
  if(!confirm(msg))return;
  db.predmeti=db.predmeti.filter(x=>x.id!==id);
  db.aktivnosti=db.aktivnosti.filter(a=>a.predmetId!==id);
  db.finansije=db.finansije.filter(f=>f.predmetId!==id);
  saveDB();
  detailId=null;navigate('predmeti');
}
function editPredmet(id){openPredmetModal(id)}

function predmetSearchInput(inputId, selectedId, selectedLabel){
  const safeLabel = (selectedLabel||'').replace(/"/g,'&quot;');
  const safeId = (selectedId||'').replace(/"/g,'&quot;');
  return '<div style="position:relative">' +
    '<input id="'+inputId+'_search" value="'+safeLabel+'" placeholder="Pretraži po imenu, broju predmeta..." ' +
    'style="width:100%;box-sizing:border-box" ' +
    'oninput="formPredmetSearch(\''+inputId+'\', this.value)" ' +
    'onblur="setTimeout(function(){var d=document.getElementById(\''+inputId+'_results\');if(d)d.style.display=\'none\'},200)" ' +
    'autocomplete="off">' +
    '<div id="'+inputId+'_results" style="position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-height:220px;overflow-y:auto;z-index:200;display:none;box-shadow:0 4px 12px rgba(0,0,0,.12)"></div>' +
    '<input type="hidden" id="'+inputId+'" value="'+safeId+'">' +
    '</div>';
}

function formPredmetSearch(inputId, query){
  var resultsEl = document.getElementById(inputId+'_results');
  if(!resultsEl) return;
  var q = normalizeStr(query);
  if(!q){ resultsEl.style.display='none'; return; }
  var matches = db.predmeti
    .filter(function(p){ return p.status !== 'arhiviran'; })
    .filter(function(p){
      var k = getKlijent(p.klijentId);
      return normalizeStr(k?k.ime:'').includes(q) ||
             normalizeStr(p.interni||'').includes(q) ||
             normalizeStr(p.sudski||'').includes(q);
    }).slice(0,15);
  if(matches.length === 0){
    resultsEl.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--text3)">Nema rezultata</div>';
  } else {
    resultsEl.innerHTML = matches.map(function(p){
      var k = getKlijent(p.klijentId);
      return '<div onmousedown="formPredmetPick(\''+inputId+'\',\''+p.id+'\')" '+
        'style="padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)" '+
        'onmouseover="this.style.background=\'var(--surface2)\'" '+
        'onmouseout="this.style.background=\'\'">'+
        '<span style="font-weight:600">'+esc(p.interni)+'</span> — '+esc(k?k.ime:'')+
        (p.protivna?'<span style="color:var(--text3);font-size:11px;margin-left:4px">vs. '+esc(p.protivna)+'</span>':'')+
        '<span style="color:var(--text3);font-size:11px;margin-left:6px">'+esc(p.sudski||'')+'</span>'+
        '</div>';
    }).join('');
  }
  resultsEl.style.display = 'block';
}

function formPredmetPick(inputId, predmetId){
  var p = getPredmet(predmetId);
  var k = p ? getKlijent(p.klijentId) : null;
  var label = p ? (p.interni+' — '+(k?k.ime:'')+(p.protivna?' vs. '+p.protivna:'')) : '';
  document.getElementById(inputId).value = predmetId;
  var searchEl = document.getElementById(inputId+'_search');
  if(searchEl) searchEl.value = label;
  var resultsEl = document.getElementById(inputId+'_results');
  if(resultsEl) resultsEl.style.display = 'none';
}

let addFinPredId=null,addFinKlId=null;
function finansijeModalBody(f,predId,klId){
  const selP = f?.predmetId||predId||'';
  const selPObj = selP ? getPredmet(selP) : null;
  const selK = selPObj ? getKlijent(selPObj.klijentId) : null;

function updateFinStatus(){
  const fakt=parseFloat(document.getElementById('f_fakt')?.value)||0;
  const plac=parseFloat(document.getElementById('f_plac')?.value)||0;
  const sel=document.getElementById('f_status');
  const preview=document.getElementById('fin_status_preview');
  if(!sel||!preview)return;
  if(fakt>0&&plac>=fakt){
    sel.value='placeno';
    preview.textContent='✓ Automatski: Plaćeno';
    preview.style.color='var(--success)';
  } else if(plac>0&&plac<fakt){
    sel.value='delim_placeno';
    preview.textContent='◑ Delimično plaćeno';
    preview.style.color='var(--warn)';
  } else {
    sel.value='nije_placeno';
    preview.textContent='';
  }
}
function saveModal(){
  if(currentModal==='_editEvent'){ saveEditEvent(); return; }
  if(currentModal==='gcal'){
    const _activeTipBtn = document.querySelector('#tip_buttons .tip-btn.active') || document.querySelector('#tip_buttons .tip-btn[style*="var(--accent-light)"]');
    const tip = (_activeTipBtn && _activeTipBtn.dataset.tip) || document.getElementById('m_ev_tip')?.value || 'Ročište';
    const naziv = document.getElementById('m_ev_naziv').value.trim();
    const datum = document.getElementById('m_ev_datum').value;
    const vreme = document.getElementById('m_ev_vreme').value.trim();
    const predmetId = document.getElementById('m_ev_predmet')?.value || '';
    const klijentId = document.getElementById('m_ev_klijent')?.value || '';
    if(!datum){ alert('Unesite datum.'); return; }
    const parts = datum.split('/');
    if(parts.length!==3||parts[2].length!==4){ alert('Format datuma: DD/MM/YYYY'); return; }
    const iso = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    const p = predmetId ? getPredmet(predmetId) : null;
    const k = p ? getKlijent(p.klijentId) : (klijentId ? getKlijent(klijentId) : null);
    // Privatno: naziv obavezan, nema predmeta
    if(tip==='Privatno' && !naziv){ alert('Unesite naziv privatnog događaja.'); return; }
    const finalNaziv = naziv || (p ? `${tip}: ${p.interni} — ${k?k.ime:''}` : (k ? `${tip}: ${k.ime}` : tip));
    (async()=>{
      try{
        const _vt3=parseVreme(vreme);const hh=_vt3?_vt3.hh:'09';const mm=_vt3?_vt3.mm:'00';
        const startStr = `${iso}T${(hh||'09').padStart(2,'0')}:${(mm||'00').padStart(2,'0')}:00`;
        const endD = new Date(`${iso}T${(hh||'09').padStart(2,'0')}:${(mm||'00').padStart(2,'0')}:00`);
        endD.setMinutes(endD.getMinutes() + 30);
        const endHH = String(endD.getHours()).padStart(2,'0');
        const endMM = String(endD.getMinutes()).padStart(2,'0');
        const endDateStr = endD.getFullYear()+'-'+String(endD.getMonth()+1).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0');
        const endStr = `${endDateStr}T${endHH}:${endMM}:00`;
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        // Boje i trajanje po tipu
        const colorMap = {'Ročište':'11','Konsultacije':'7','Rok':'6','Privatno':'8'};
        const trajanje = tip==='Konsultacije' ? 60 : tip==='Privatno' ? 60 : 30;
        endD.setMinutes(endD.getMinutes() + trajanje - 30); // already added 30 above
        let ev = { summary:finalNaziv, start:{dateTime:startStr,timeZone:tz}, end:{dateTime:endStr,timeZone:tz}, colorId:colorMap[tip]||'7' };
        if(p) ev.description = `Predmet: ${p.interni}\nKlijent: ${k?k.ime:''}\nSud: ${p.sud||''}`;
        const resp = await gapi.client.calendar.events.insert({ calendarId:'primary', resource:ev });
        const links = gGetLinks();
        if(p){
          links[resp.result.id] = {predmetId, klijentId: p.klijentId};
          gSaveLinks(links);
          if(tip==='Ročište'){ p.rociste=iso; saveDB(); }
        } else if(klijentId){
          links[resp.result.id] = {predmetId:'', klijentId};
          gSaveLinks(links);
        }
        await gLoadCalendarEvents();
        closeModal();
        renderPage();
      } catch(e){ alert('Greška: '+(e.result?.error?.message||e.message)); }
    })();
    return;
  }
  if(currentModal==='klijent'){
    const ime=document.getElementById('f_ime').value.trim();
    const noviKid=(document.getElementById('f_kid')?.value||'').trim();
    if(!ime){alert('Unesite ime/naziv!');return}
    if(editId){
      const k=db.klijenti.find(c=>c.id===editId);
      // Handle ID change
      if(noviKid && noviKid !== editId){
        const duplikat=db.klijenti.find(c=>c.id===noviKid);
        if(duplikat){alert('ID "'+noviKid+'" već postoji! Izaberite drugi.');return}
        // Update all references
        db.predmeti.forEach(p=>{ if(p.klijentId===editId) p.klijentId=noviKid; });
        db.finansije.forEach(f=>{ if(f.klijentId===editId) f.klijentId=noviKid; });
        k.id=noviKid;
      }
      Object.assign(k,{ime,tip:v('f_tip'),jmbg:v('f_jmbg'),pib:v('f_pib'),mb:v('f_mb'),racun:v('f_racun'),telefon:v('f_tel'),email:v('f_email'),adresa:v('f_adresa'),napomena:v('f_napomena'),datum:getDateVal('f_datum')});
    } else {
      const newId=noviKid||genId('K');
      if(noviKid&&db.klijenti.find(c=>c.id===noviKid)){alert('ID "'+noviKid+'" već postoji!');return}
      db.klijenti.push({id:newId,ime,tip:v('f_tip'),jmbg:v('f_jmbg'),pib:v('f_pib'),mb:v('f_mb'),racun:v('f_racun'),telefon:v('f_tel'),email:v('f_email'),adresa:v('f_adresa'),napomena:v('f_napomena'),datum:getDateVal('f_datum')});
    }
  } else if(currentModal==='predmet'){
    const vrsta=v('f_vrsta');
    const interni=v('f_interni').trim();
    if(!interni){alert('Unesite interni broj predmeta!');return}
    const duplikat=db.predmeti.find(x=>x.interni===interni&&x.id!==editId);
    if(duplikat){alert('Interni broj "'+interni+'" već postoji! Izaberite drugi broj.');return}
    // Resolve klijentId: existing or create new
    let klijentId='';
    if(_klijentMode==='postojeci'){
      klijentId=document.getElementById('f_klijent_id')?.value||'';
      if(!klijentId){alert('Izaberite klijenta ili odaberite "Novi klijent"!');return}
    } else {
      // New klijent
      const kIme=(document.getElementById('f_k_ime')?.value||'').trim();
      if(!kIme){alert('Unesite ime klijenta!');return}
      const newK={
        id:genId('K'),ime:kIme,
        tip:document.getElementById('f_k_tip')?.value||'fizicko',
        jmbg:document.getElementById('f_k_jmbg')?.value||'',
        pib:document.getElementById('f_k_pib')?.value||'',
        telefon:document.getElementById('f_k_tel')?.value||'',
        email:document.getElementById('f_k_email')?.value||'',
        adresa:document.getElementById('f_k_adresa')?.value||'',
        napomena:document.getElementById('f_k_napomena')?.value||'',
        datum:new Date().toISOString().slice(0,10)
      };
      db.klijenti.push(newK);
      klijentId=newK.id;
    }
    if(editId){
      const p=db.predmeti.find(x=>x.id===editId);
      const noviOpisTekst = v('f_opis').trim();
      const opisDatumEdit = getDateVal('f_opis_datum') || new Date().toISOString().slice(0,10);
      let opisDnevnikEdit = p.opisDnevnik ? [...p.opisDnevnik] : [];
      // Migracija starog opis polja
      if(opisDnevnikEdit.length===0 && p.opis){
        opisDnevnikEdit.push({datum:'(raniji)', tekst:p.opis});
      }
      if(noviOpisTekst){
        opisDnevnikEdit.push({datum:opisDatumEdit, tekst:noviOpisTekst});
      }
      const opisZaPrikaz = opisDnevnikEdit.length>0 ? opisDnevnikEdit[opisDnevnikEdit.length-1].tekst : '';
      Object.assign(p,{interni,klijentId,vrsta,sudski:v('f_sudski'),sud:v('f_sud'),protivna:v('f_protivna'),status:v('f_status'),datum:getDateVal('f_datum'),rociste:getDateVal('f_rociste'),vrednost:parseFloat(v('f_vrednost'))||0,opis:opisZaPrikaz,opisDnevnik:opisDnevnikEdit,napomena:v('f_napomena')});
    } else {
      const autoVal=genPredmetBroj(vrsta);
      const finalInterni=interni||autoVal;
      const noviOpisTekstN = v('f_opis').trim();
      const opisDatumNew = getDateVal('f_opis_datum') || new Date().toISOString().slice(0,10);
      const opisDnevnikNew = noviOpisTekstN ? [{datum:opisDatumNew, tekst:noviOpisTekstN}] : [];
      db.predmeti.push({id:genId('P'),interni:finalInterni,sudski:v('f_sudski'),klijentId,vrsta,sud:v('f_sud'),protivna:v('f_protivna'),status:v('f_status'),datum:getDateVal('f_datum'),rociste:getDateVal('f_rociste'),vrednost:parseFloat(v('f_vrednost'))||0,opis:noviOpisTekstN,opisDnevnik:opisDnevnikNew,napomena:v('f_napomena')});
    }
  } else if(currentModal==='aktivnost'){
    const predmetId=v('f_predmet');const opis=v('f_opis');
    if(!predmetId){alert('Izaberite predmet!');return}
    if(!opis){alert('Unesite opis!');return}
    db.aktivnosti.push({id:genId('A'),predmetId,datum:getDateVal('f_datum'),vrsta:v('f_vrsta'),opis,sledeci:v('f_sledeci'),rok:getDateVal('f_rok'),zavrseno:false});
  } else if(currentModal==='finansije'){
    const stavkeVal=collectStavke()||[];
    const fakt=stavkeVal.reduce((s,x)=>s+(parseFloat(x.cena)||0),0);
    const opis=stavkeVal.map(x=>x.vrsta).filter(Boolean).join(', ');
    if(!fakt||!opis){alert('Dodajte bar jednu stavku sa opisom i cenom!');return;}
    const predmetId=v('f_predmet');
    const klijentId=predmetId?(db.predmeti.find(p=>p.id===predmetId)?.klijentId||addFinKlId):addFinKlId;
    const plac=parseFloat(v('f_plac'))||0;
    let autoStatus='nije_placeno';
    if(plac>=fakt&&fakt>0)autoStatus='placeno';
    else if(plac>0)autoStatus='delim_placeno';
    let datUpl=getDateVal('f_dat_upl');
    if(autoStatus==='placeno'&&!datUpl)datUpl=new Date().toISOString().slice(0,10);
    if(editId){
      const f=db.finansije.find(x=>x.id===editId);
      Object.assign(f,{predmetId,klijentId,opis,brFakture:v('f_brfakture'),valuta:v('f_valuta')||'RSD',fakturisano:fakt,placeno:plac,stavke:stavkeVal,status:autoStatus,datum_fakture:getDateVal('f_dat_fakt'),datum_uplate:datUpl,napomena:v('f_napomena')});
    } else {
      db.finansije.push({id:genId('F'),predmetId,klijentId,opis,brFakture:v('f_brfakture'),valuta:v('f_valuta')||'RSD',fakturisano:fakt,placeno:plac,stavke:stavkeVal,status:autoStatus,datum_fakture:getDateVal('f_dat_fakt'),datum_uplate:datUpl,napomena:v('f_napomena')});
    }
  }
  saveDB();
  closeModal();renderPage();
}

function exportData(){
  const gcalLinks = gGetLinks();
  const backup = { ...db, _gcalLinks: gcalLinks };
  const data = JSON.stringify(backup, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `LexOffice_backup_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const parsed = JSON.parse(ev.target.result);
        // Basic validation
        if(!parsed.klijenti || !parsed.predmeti){
          alert('Nevažeći backup fajl!');
          return;
        }
        if(!confirm(`Uvesti podatke iz fajla "${file.name}"?\n\nOvo će ZAMENITI sve trenutne podatke!\n\nKlijenata: ${parsed.klijenti.length}\nPredmeta: ${parsed.predmeti.length}\nFinansija: ${(parsed.finansije||[]).length}`)){
          return;
        }
        // Restore GCal links if present
        if(parsed._gcalLinks){
          gSaveLinks(parsed._gcalLinks);
          delete parsed._gcalLinks;
        }
        db = parsed;
        saveDB();
        renderPage();
        alert('✓ Podaci uspešno uvezeni!');
      } catch(err){
        alert('Greška pri čitanju fajla: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}



// ========== GCAL EVENT - PREDMET LINKING ==========
// Stored in localStorage: { eventId: predmetId, ... }
function gGetLinks(){
  try{ return JSON.parse(localStorage.getItem('lexoffice_gcal_links')||'{}'); }
  catch(e){ return {}; }
}
function gLinkPredmetId(link){
  if(!link) return null;
  if(typeof link==='string') return link||null;
  return link.predmetId||null;
}
function gLinkKlijentId(link){
  if(!link) return null;
  if(typeof link==='string') return null;
  return link.klijentId||null;
}
function gSaveLinks(links){
  localStorage.setItem('lexoffice_gcal_links', JSON.stringify(links));
}
function gGetAutoLinked(){
  try{ return JSON.parse(localStorage.getItem('lexoffice_gcal_autolinked')||'{}'); }
  catch(e){ return {}; }
}
function gSaveAutoLinked(obj){
  localStorage.setItem('lexoffice_gcal_autolinked', JSON.stringify(obj));
}
function gLinkEvent(eventId, predmetId){
  const links = gGetLinks();
  if(predmetId){ links[eventId] = predmetId; }
  else { delete links[eventId]; }
  gSaveLinks(links);
  // Ručna izmena — ukloni auto oznaku
  const autoLinked = gGetAutoLinked();
  delete autoLinked[eventId];
  gSaveAutoLinked(autoLinked);
  if(predmetId){
    const p = getPredmet(predmetId);
    const k = p ? getKlijent(p.klijentId) : null;
    // Rename GCal event
    if(p && k) gRenameEvent(eventId, k.ime, p.interni);
    // Smer 2: update predmet rociste from GCal event date
    syncGCalToPredmet(eventId, predmetId);
  }
  renderPage();
}

async function gRenameEvent(eventId, klijentIme, interniStr){
  if(!gIsSignedIn) return;
  try{
    // Get current event to preserve other fields
    const ev = await gapi.client.calendar.events.get({
      calendarId: 'primary',
      eventId: eventId
    });
    const newSummary = klijentIme + (interniStr ? ' — ' + interniStr : '');
    await gapi.client.calendar.events.patch({
      calendarId: 'primary',
      eventId: eventId,
      resource: { summary: newSummary }
    });
    // Refresh events
    await gLoadCalendarEvents();
    renderPage();
  } catch(e){
    console.warn('Rename event error:', e);
  }
}

// ========== GCAL <-> PREDMET SINHRONIZACIJA ==========

// Smer 1: Predmet ročište -> Google Calendar
async function syncRocisteToGCal(predmetId, oldRociste){
  if(!gIsSignedIn) return;
  const p = getPredmet(predmetId);
  if(!p || !p.rociste) return;
  const k = getKlijent(p.klijentId);

  // Check if there's already a linked event
  const links = gGetLinks();
  const existingEventId = Object.keys(links).find(eid => links[eid] === predmetId);

  try{
    if(existingEventId){
      // Update existing GCal event
      await gapi.client.calendar.events.patch({
        calendarId: 'primary',
        eventId: existingEventId,
        resource: {
          summary: k.ime + ' — ' + p.interni,
          start: { dateTime: `${p.rociste}T09:00:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          end: { dateTime: `${p.rociste}T09:30:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          location: p.sud || '',
          description: 'Predmet: ' + p.interni + '\nKlijent: ' + k.ime + '\nSud: ' + (p.sud||'') + '\nProtivna strana: ' + (p.protivna||'—')
        }
      });
    } else {
      // Create new GCal event and link it
      const resp = await gapi.client.calendar.events.insert({
        calendarId: 'primary',
        resource: {
          summary: k.ime + ' — ' + p.interni,
          start: { dateTime: `${p.rociste}T09:00:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          end: { dateTime: `${p.rociste}T09:30:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          location: p.sud || '',
          colorId: '11',
          description: 'Predmet: ' + p.interni + '\nKlijent: ' + k.ime + '\nSud: ' + (p.sud||'') + '\nProtivna strana: ' + (p.protivna||'—'),
          reminders: {
            useDefault: false,
            overrides: [
              { method: 'email', minutes: 24*60 },
              { method: 'popup', minutes: 60 }
            ]
          }
        }
      });
      // Auto-link new event to predmet
      const newEventId = resp.result.id;
      const newLinks = gGetLinks();
      newLinks[newEventId] = predmetId;
      gSaveLinks(newLinks);
    }
    await gLoadCalendarEvents();
  } catch(e){
    console.warn('GCal sync error:', e);
  }
}

// Smer 2: GCal event link -> update predmet rociste
async function syncGCalToPredmet(eventId, predmetId){
  if(!predmetId) return;
  const ev = gCalendarEvents.find(e => e.id === eventId);
  if(!ev) return;
  const p = getPredmet(predmetId);
  if(!p) return;

  const evDate = (ev.start?.dateTime || ev.start?.date || '').slice(0,10);
  if(!evDate) return;

  // Update predmet rociste
  p.rociste = evDate;
  saveDB();
  renderPage();
}

function formatVremeInput(el){
  let v = el.value.replace(/[^0-9:.]/g,'').replace(/\./g,':');
  if(v.length===2 && !v.includes(':') && el._prevLen<2){ v=v+':'; }
  el.value=v.slice(0,5); el._prevLen=el.value.length;
}
function parseVreme(vreme){
  if(!vreme) return null;
  let v=vreme.trim().replace(/[.,]/g,':');
  if(!v.includes(':') && /^\d{3,4}$/.test(v)){ v=v.slice(0,-2)+':'+v.slice(-2); }
  const parts=v.split(':');
  if(parts.length<2) return null;
  const hh=parts[0].padStart(2,'0'); const mm=(parts[1]||'00').padStart(2,'0');
  if(isNaN(+hh)||isNaN(+mm)) return null;
  return {hh,mm};
}

// ========== SEARCHABLE SELECT ==========
function buildSearchSelect(wrapperId,hiddenId,options,placeholder){
  const wrap=document.getElementById(wrapperId);
  if(!wrap) return;
  const hidden=document.getElementById(hiddenId);
  const currentVal=hidden?hidden.value:'';
  const currentLabel=currentVal?(options.find(o=>o.value===currentVal)?.label||''):'';
  wrap.innerHTML=`<input type="text" class="ss-input" id="${wrapperId}_input" placeholder="${placeholder||'Pretraži...'}" value="${currentLabel}" autocomplete="off" onkeydown="ssKeydown(event,'${wrapperId}')" oninput="ssFilter('${wrapperId}')"><div class="ss-dropdown" id="${wrapperId}_dd"></div>`;
  wrap._ssOptions=options; wrap._ssHiddenId=hiddenId;
  if(wrap._ssClickHandler) document.removeEventListener('mousedown',wrap._ssClickHandler);
  wrap._ssClickHandler=function(e){if(!document.getElementById(wrapperId)?.contains(e.target)){ssClose(wrapperId);}};
  document.addEventListener('mousedown',wrap._ssClickHandler);
}
function ssRenderOptions(wrapperId,query){
  const wrap=document.getElementById(wrapperId);if(!wrap)return;
  const dd=document.getElementById(wrapperId+'_dd');if(!dd)return;
  const norm=s=>s.toLowerCase().replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'dj');
  const q=norm(query||'');
  const filtered=q?(wrap._ssOptions||[]).filter(o=>norm(o.label).includes(q)):(wrap._ssOptions||[]);
  const currentVal=(document.getElementById(wrap._ssHiddenId)||{}).value||'';
  dd.innerHTML=!filtered.length?'<div class="ss-empty">Nema rezultata</div>':filtered.map(o=>{
    const vsIdx=o.value?o.label.indexOf(' vs. '):-1;
    const mainLabel=vsIdx>-1?o.label.slice(0,vsIdx):o.label;
    const vsLabel=vsIdx>-1?o.label.slice(vsIdx+1):'';
    return `<div class="ss-option${o.value===currentVal?' selected':''}" data-value="${o.value}" data-label="${o.label.replace(/"/g,'&quot;')}" onmousedown="ssPick('${wrapperId}','${o.value}',this.dataset.label)"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${mainLabel}</div>${vsLabel?`<div style="font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${vsLabel}</div>`:''}</div>`;
  }).join('');
}
function ssFilter(wrapperId){
  const input=document.getElementById(wrapperId+'_input');if(!input)return;
  const dd=document.getElementById(wrapperId+'_dd');
  if(input.value.length>0){if(dd)dd.classList.add('open');ssRenderOptions(wrapperId,input.value);}
  else{const wrap=document.getElementById(wrapperId);const hidden=document.getElementById(wrap?._ssHiddenId);if(hidden)hidden.value='';if(dd)dd.classList.remove('open');}
}
function ssClose(wrapperId){
  const dd=document.getElementById(wrapperId+'_dd');if(dd)dd.classList.remove('open');
  const wrap=document.getElementById(wrapperId);if(!wrap)return;
  const hidden=document.getElementById(wrap._ssHiddenId);
  const currentVal=hidden?hidden.value:'';
  const currentLabel=currentVal?((wrap._ssOptions||[]).find(o=>o.value===currentVal)?.label||''):'';
  const input=document.getElementById(wrapperId+'_input');if(input)input.value=currentLabel;
}
function ssPick(wrapperId,value,label){
  const wrap=document.getElementById(wrapperId);if(!wrap)return;
  const hidden=document.getElementById(wrap._ssHiddenId);if(hidden)hidden.value=value;
  const input=document.getElementById(wrapperId+'_input');if(input)input.value=value?label:'';
  const dd=document.getElementById(wrapperId+'_dd');if(dd){dd.classList.remove('open');dd.innerHTML='';}
  if(wrap._ssClickHandler){document.removeEventListener('mousedown',wrap._ssClickHandler);wrap._ssClickHandler=null;}
}
function ssKeydown(e,wrapperId){
  const dd=document.getElementById(wrapperId+'_dd');if(!dd)return;
  const items=dd.querySelectorAll('.ss-option');const focused=dd.querySelector('.ss-option.focused');
  if(e.key==='ArrowDown'){e.preventDefault();if(!dd.classList.contains('open')){dd.classList.add('open');ssRenderOptions(wrapperId,document.getElementById(wrapperId+'_input')?.value||'');}
    if(!focused)items[0]?.classList.add('focused');else{focused.classList.remove('focused');(focused.nextElementSibling||items[0]).classList.add('focused');}
    dd.querySelector('.focused')?.scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){e.preventDefault();if(!focused)items[items.length-1]?.classList.add('focused');else{focused.classList.remove('focused');(focused.previousElementSibling||items[items.length-1]).classList.add('focused');}
    dd.querySelector('.focused')?.scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){e.preventDefault();if(focused)focused.dispatchEvent(new MouseEvent('mousedown'));}
  else if(e.key==='Escape'){ssClose(wrapperId);}
}
function buildPredmetSearchSelect(wrapperId,hiddenId,currentVal){

}
